[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # FastAPI uses function-call defaults (Depends(), Query())

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra --strict-markers --ignore=tests/e2e"
filterwarnings = [
    # Starlette's TestClient warns that its httpx transport is deprecated in favour of
    # httpx2. Kronos doesn't pick the transport; revisit when bumping starlette/fastapi.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "e2e: end-to-end tests that require a live browser (deselect with -m 'not e2e')",
]
