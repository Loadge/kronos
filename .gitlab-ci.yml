# Kronos pipeline: tests on every push; on the default branch, tests -> INT (automatic) -> PROD (manual).
# The shared blocks (.test-python, .deploy, .notify-failure) come from root/ci-templates.
#
# No host details live here (this repo is mirrored publicly). They come from CI/CD variables:
#   DEPLOY_HOST, DEPLOY_PATH, DEPLOY_URL, DEPLOY_CONTAINER, DEPLOY_APP_PORT   (scoped per environment)
#   SSH_KEY (File, protected), SSH_KNOWN_HOSTS                                (deploy access)
#   TELEGRAM_BOT_TOKEN (masked, protected), TELEGRAM_CHAT_ID                  (failure notices)
#   GITHUB_MIRROR_TOKEN (masked, protected), GITHUB_MIRROR_REPO, MIRROR_DENYLIST (public mirror + its guard)
# Protected variables only exist on protected branches: INT/PROD deploys and notices happen on master only.

include:
  - project: 'root/ci-templates'
    ref: master
    file: '/templates/deploy.yml'

stages: [test, int, prod, mirror]

unit:
  extends: .test-python
  stage: test

e2e:
  extends: .test-python
  stage: test
  script:
    - pip install -q -r requirements-dev.txt
    - playwright install --with-deps chromium
    - pytest tests/e2e -q -p no:cacheprovider

deploy-int:
  extends: .deploy
  stage: int
  needs: [unit, e2e]
  environment: int
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - DEPLOY_SKIP_TESTS=1 bash deploy.sh

deploy-prod:
  extends: .deploy
  stage: prod
  needs: [deploy-int]
  environment: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  script:
    - DEPLOY_SKIP_TESTS=1 bash deploy.sh

# Public mirror (GitHub is the public face; GitLab is the origin). It runs only after INT is green, and
# only if ci/mirror-guard.sh passes: no secret (gitleaks) and none of MIRROR_DENYLIST in what is published.
# A normal fast-forward push; a rewritten history needs a deliberate force by hand.
mirror-github:
  stage: mirror
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  needs: [deploy-int]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -n "$GITHUB_MIRROR_TOKEN" || { echo "NO GITHUB_MIRROR_TOKEN on ref $CI_COMMIT_REF_NAME - nothing published"; exit 1; }
    - test -n "$GITHUB_MIRROR_REPO" || { echo "NO GITHUB_MIRROR_REPO - nothing published"; exit 1; }
    - sh ci/mirror-guard.sh
    - git push "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPO}.git" "HEAD:refs/heads/${CI_DEFAULT_BRANCH}"

notify-failure:
  extends: .notify-failure
