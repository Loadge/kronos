<!-- ========================= SETTINGS ========================= -->
<template x-if="tab==='settings'">
<section aria-label="Settings" class="settings-layout" x-init="$nextTick(() => initSettingsSpy($el))">

  <header class="page-head settings-head">
    <div class="page-head-title"><h2>Settings <span class="page-sub" x-text="'· ' + settingsGroupLabel()"></span></h2></div>
    <div class="page-head-controls">
      <template x-if="settingsGroup === 'freelance'">
        <button type="button" class="head-btn" @click="openCalculator()" title="See what these numbers mean for a rate, a day, a year">⚡ Open the calculator</button>
      </template>
    </div>
  </header>

  <!-- Two levels: the three groups, and the sections of the open one (scroll-spied).
       On the phone the same two levels are two dropdowns above the content. -->
  <nav class="settings-index" aria-label="Settings sections">
    <template x-for="g in SETTINGS_GROUPS" :key="g.id">
      <div class="settings-group" :class="settingsGroup === g.id ? 'open' : ''">
        <button type="button" class="settings-group-btn" @click="setSettingsGroup(g.id)"
                :aria-expanded="settingsGroup === g.id ? 'true' : 'false'" :aria-current="settingsGroup === g.id ? 'true' : null">
          <span><span aria-hidden="true" x-show="g.mark" x-text="g.mark"></span> <span x-text="g.label"></span></span>
        </button>
        <div class="settings-group-sections" x-show="settingsGroup === g.id"
             x-effect="settingsActive; settingsGroup; $nextTick(() => settingsTick($el))">
          <template x-for="s in settingsSections(g.id)" :key="s.id">
            <a :href="'#' + s.id" :class="settingsActive === s.id ? 'active' : ''"
               @click.prevent="settingsJump(s.id)" x-text="s.label"></a>
          </template>
        </div>
      </div>
    </template>
  </nav>
  <div class="settings-dropdowns" aria-label="Settings sections (phone)">
    <select aria-label="Settings group" :value="settingsGroup" @change="setSettingsGroup($event.target.value)">
      <template x-for="g in SETTINGS_GROUPS" :key="g.id">
        <option :value="g.id" x-text="(g.mark ? g.mark + ' ' : '') + g.label" :selected="settingsGroup === g.id"></option>
      </template>
    </select>
    <select aria-label="Settings section" :value="settingsActive" @change="settingsJump($event.target.value)">
      <template x-for="s in settingsSections()" :key="s.id">
        <option :value="s.id" x-text="s.label" :selected="settingsActive === s.id"></option>
      </template>
    </select>
  </div>

  <div class="settings-content" :data-group="settingsGroup">

  <!-- ═══ Employee ═══════════════════════════════════════════════════════ -->
  <template x-if="settingsGroup === 'employee'">
  <div class="settings-cards">

    <!-- ── Work ──────────────────────────────────────────────────────────── -->
    <form class="settings-card" id="settings-work" @submit.prevent="saveSettings('work')" @input="settingsTouched('work', $event)" @change="settingsTouched('work', $event, true)">
      <div class="settings-card-head">
        <div>
          <h3>Work</h3>
        </div>
        <span class="settings-saved" :class="settingsStatusCls('work')" x-text="settingsStatusText('work')" aria-live="polite"></span>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-target">Daily target</label>
        <div class="srow-ctl">
          <input id="set-target" type="number" class="ctl-num" x-model.number="settingsForm.daily_target_hours" min="0.1" max="24" step="0.1" required>
          <span class="unit">h / day</span>
        </div>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-start">Default hours</label>
        <div class="srow-ctl">
          <input id="set-start" type="time" class="ctl-time" x-model="settingsForm.default_start_time" required>
          <span class="unit">–</span>
          <input type="time" class="ctl-time" x-model="settingsForm.default_end_time" aria-label="Default end time" required>
        </div>
      </div>
      <div class="srow">
        <span class="srow-key">Work week
          <small>Days that count toward the target; the forecast counts the remaining ones.</small></span>
        <div class="srow-ctl">
          <div class="work-week-picker" role="group" aria-label="Work week">
            <template x-for="(day, i) in ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']" :key="i">
              <button type="button"
                      :class="['work-week-day', settingsForm.work_week_days.includes(i) ? 'active' : '']"
                      @click="toggleWorkDay(i)"
                      :aria-pressed="settingsForm.work_week_days.includes(i)"
                      x-text="day"></button>
            </template>
          </div>
        </div>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-since">Cumulative since
          <small>The running surplus / deficit starts on this date.</small></label>
        <div class="srow-ctl">
          <input id="set-since" type="date" class="ctl-date" x-model="settingsForm.cumulative_start_date" required>
        </div>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-reset">Reset on January 1st
          <small>The cumulative clock restarts every year; past years stay in the yearly breakdown.</small></label>
        <div class="srow-ctl">
          <input id="set-reset" type="checkbox" role="switch" x-model="settingsForm.reset_annually">
        </div>
      </div>

      <!-- Date-effective target. Collapsed: the common case is one target, edited above. -->
      <details class="target-schedule">
        <summary>Advanced: my contracted hours changed over time</summary>
        <div class="target-schedule-body">
          <small>
            Did your hours per day change at some point? Add the date it started and the new
            hours. Each logged day is measured against the hours that applied on that date.
          </small>
          <template x-for="(row, i) in settingsForm.daily_target_schedule" :key="row._k">
            <div class="target-schedule-row">
              <label>
                From
                <input type="date" x-model="row.effective_from" required>
              </label>
              <label>
                Hours / day
                <input type="number" x-model.number="row.hours" min="0.1" max="24" step="0.1" required>
              </label>
              <button type="button" class="target-schedule-remove"
                      @click="removeTargetChange(i)"
                      :disabled="settingsForm.daily_target_schedule.length <= 1"
                      aria-label="Remove this target change">✕</button>
            </div>
          </template>
          <div class="target-schedule-actions">
            <button type="button" class="secondary outline compact" @click="addTargetChange()">+ Add a change</button>
            <span class="settings-saved" :class="settingsStatusCls('timeline')" x-text="settingsStatusText('timeline')" aria-live="polite"></span>
          </div>
        </div>
      </details>
    </form>

    <!-- ── Leave ─────────────────────────────────────────────────────────── -->
    <form class="settings-card" id="settings-leave" @submit.prevent="saveSettings('leave')" @input="settingsTouched('leave', $event)" @change="settingsTouched('leave', $event, true)">
      <div class="settings-card-head">
        <div>
          <h3>Leave</h3>
        </div>
        <span class="settings-saved" :class="settingsStatusCls('leave')" x-text="settingsStatusText('leave')" aria-live="polite"></span>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-budget">Vacation budget</label>
        <div class="srow-ctl">
          <input id="set-budget" type="number" class="ctl-num" x-model.number="settingsForm.vacation_budget_days" min="0" max="365" step="0.5" required>
          <span class="unit">days</span>
        </div>
      </div>
    </form>

    <!-- ── Holidays ──────────────────────────────────────────────────────── -->
    <div class="settings-card" id="settings-holidays">
      <div class="settings-card-head">
        <div>
          <h3>Holidays</h3>
          <p class="muted">Import <strong x-text="holidayYear"></strong>'s official public holidays as <code>holiday</code> days. Logged dates are skipped, nothing is overwritten.</p>
        </div>
        <button type="button" class="btn-action btn-action--outline" @click="importHolidays()"
                :aria-busy="holidayImporting"
                :disabled="holidayImporting || !settingsForm.holiday_country || holidayNothingToImport()"
                :title="!settingsForm.holiday_country ? 'Pick a country first' : null"
                x-text="holidayImportLabel()"></button>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-country">Country</label>
        <div class="srow-ctl">
          <select id="set-country" class="ctl-select" x-model="settingsForm.holiday_country" @change="onHolidayCountryChange()">
            <option value="">Select a country…</option>
            <template x-for="c in holidayCountries" :key="c.code">
              <option :value="c.code" x-text="c.name"></option>
            </template>
          </select>
        </div>
      </div>
      <div class="srow" x-show="holidaySubdivisions.length > 0">
        <label class="srow-key" for="set-region">Region
          <small>Needed for the regional dates; without one only the holidays every region shares are imported.</small></label>
        <div class="srow-ctl">
          <select id="set-region" class="ctl-select" x-model="settingsForm.holiday_region" @change="loadHolidayPreview()">
            <option value="">National only</option>
            <template x-for="code in holidaySubdivisions" :key="code">
              <option :value="code" x-text="code"></option>
            </template>
          </select>
        </div>
      </div>

      <!-- Mini-calendar preview of what will be imported -->
      <template x-if="settingsForm.holiday_country && holidayPreview.length">
        <div class="holiday-preview">
          <div class="holiday-preview-head">
            <strong x-text="holidayPreview.length + ' holidays in ' + holidayYear"></strong>
            <span class="muted" x-text="holidayPreviewSummary()"></span>
          </div>
          <div class="holiday-cal-grid">
            <template x-for="m in holidayMonths()" :key="m.key">
              <div class="holiday-cal">
                <div class="holiday-cal-title" x-text="m.label"></div>
                <div class="holiday-cal-days">
                  <template x-for="d in m.dow" :key="d">
                    <span class="holiday-cal-dow" x-text="d.slice(0,1)"></span>
                  </template>
                  <template x-for="c in m.cells" :key="c.key">
                    <span class="holiday-cal-day" :class="c.cls" :title="c.title" x-text="c.label"></span>
                  </template>
                </div>
              </div>
            </template>
          </div>
          <div class="holiday-legend muted">
            <span class="holiday-legend-item"><span class="holiday-swatch is-holiday"></span> to import</span>
            <span class="holiday-legend-item" x-show="holidayPreview.some(h => h.exists)"><span class="holiday-swatch is-logged"></span> already logged (skipped)</span>
          </div>
          <ul class="holiday-list">
            <template x-for="h in holidayListItems()" :key="h.date">
              <li>
                <span class="holiday-list-date" x-text="h.label"></span>
                —
                <span x-text="h.name"></span>
                <span class="holiday-list-regional" x-show="h.regional">regional</span>
                <span class="holiday-list-logged" x-show="h.exists">already logged</span>
              </li>
            </template>
          </ul>
        </div>
      </template>
      <p class="muted holiday-note q-host">National and regional holidays only.
        <button type="button" class="q-chip" aria-label="About the holiday lists"
                data-tip="Spain uses the official BOE list (published each October for the next year); other countries use Nager.Date. Local or municipal fiestas (a town's two local holidays) are in neither: add those manually from the Log tab."
                title="Spain uses the official BOE list (published each October for the next year); other countries use Nager.Date. Local or municipal fiestas (a town's two local holidays) are in neither: add those manually from the Log tab."
                @click="$el.classList.toggle('open')" @click.outside="$el.classList.remove('open')" @keydown.escape="if ($el.classList.contains('open')) { $event.stopPropagation(); $el.classList.remove('open') }">?</button></p>
    </div>

    <!-- ── Profile ───────────────────────────────────────────────────────── -->
    <form class="settings-card" id="settings-profile" @submit.prevent="saveSettings('profile')" @input="settingsTouched('profile', $event)" @change="settingsTouched('profile', $event, true)">
      <div class="settings-card-head">
        <div>
          <h3>Profile</h3>
          <p class="muted">Printed in the header of the timesheet (Days → PDF). Leave blank what you don't want on it.</p>
        </div>
        <span class="settings-saved" :class="settingsStatusCls('profile')" x-text="settingsStatusText('profile')" aria-live="polite"></span>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-name">Name</label>
        <div class="srow-ctl"><input id="set-name" type="text" class="ctl-text" x-model="settingsForm.profile_name" maxlength="120" placeholder="Your name" autocomplete="name"></div>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-employer">Employer / client</label>
        <div class="srow-ctl"><input id="set-employer" type="text" class="ctl-text" x-model="settingsForm.profile_employer" maxlength="120" placeholder="Company"></div>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-extra">Extra line</label>
        <div class="srow-ctl"><input id="set-extra" type="text" class="ctl-text" x-model="settingsForm.profile_extra" maxlength="160" placeholder="Employee nº, team, contract…"></div>
      </div>
    </form>

    <!-- ── Day templates ─────────────────────────────────────────────────── -->
    <div class="settings-card" id="settings-templates">
      <div class="settings-card-head">
        <div>
          <h3>Day templates</h3>
        </div>
      </div>
      <template x-if="templates.length === 0">
        <p class="muted settings-empty">No templates yet. <a @click.prevent="go('log')" href="#log">Save one in Log</a></p>
      </template>
      <template x-for="t in templates" :key="t.id">
        <div class="template-item">
          <div>
            <strong x-text="t.name"></strong>
            <span class="muted" x-text="' · ' + t.start_time + '–' + t.end_time"></span>
            <template x-if="t.breaks && t.breaks.length > 0">
              <span class="muted" x-text="' · ' + t.breaks.reduce((s,b) => s+b.break_minutes,0) + ' min break'"></span>
            </template>
          </div>
          <button type="button" class="contrast outline compact" @click="deleteTemplate(t.id)">Delete</button>
        </div>
      </template>
    </div>
  </div>
  </template>

  <!-- ═══ Freelance ══════════════════════════════════════════════════════ -->
  <template x-if="settingsGroup === 'freelance'">
  <div class="settings-cards">

    <!-- ── Income sources ────────────────────────────────────────────────── -->
    <div class="settings-card" id="settings-sources">
      <div class="settings-card-head">
        <div>
          <h3>Income sources</h3>
          <p class="muted">Who you bill, at what rate, in which currency. A block takes its source's rate when it is saved — changing a rate here never rewrites the past.</p>
        </div>
      </div>
      <template x-if="sources.length === 0">
        <p class="muted settings-empty">No sources yet. <a @click.prevent="$refs.srcName.focus()" href="#settings-sources">Add one</a>.</p>
      </template>
      <template x-for="s in sources" :key="s.id">
        <div class="src-item" :class="s.archived ? 'is-archived' : ''" :style="'--src:' + sourceColor(s.id)">
          <span class="fl-dot" aria-hidden="true"></span>
          <div class="src-main">
            <strong x-text="s.name"></strong>
            <span class="metric muted" x-text="' · ' + fmtMoney(s.hourly_rate, s.currency) + '/h'"></span>
            <template x-if="s.is_default"><span class="src-tag src-tag--default">default</span></template>
            <template x-if="s.archived"><span class="src-tag">archived</span></template>
            <small class="muted" x-text="s.blocks + ' block' + (s.blocks !== 1 ? 's' : '')"></small>
          </div>
          <template x-if="accounts.length">
            <label class="src-paid"><span class="fl-lbl">Paid into</span>
              <select :aria-label="'Paid into, ' + s.name" @change="srcSetAccount(s, $event.target.value)">
                <option value="" :selected="s.default_account_id == null" x-text="'As billed (' + s.currency + ')'"></option>
                <template x-for="a in accounts.filter(x => !x.archived || x.id === s.default_account_id)" :key="a.id">
                  <option :value="a.id" :selected="a.id === s.default_account_id" x-text="a.name"></option>
                </template>
              </select>
            </label>
          </template>
          <div class="src-actions">
            <template x-if="!s.is_default && !s.archived">
              <button type="button" class="secondary outline compact" @click="srcSetDefault(s)">Make default</button>
            </template>
            <button type="button" class="secondary outline compact" @click="srcEdit(s)">Edit</button>
            <template x-if="s.blocks > 0">
              <button type="button" class="secondary outline compact" @click="srcArchive(s, !s.archived)" x-text="s.archived ? 'Unarchive' : 'Archive'"></button>
            </template>
            <template x-if="s.blocks === 0">
              <button type="button" class="contrast outline compact" @click="srcDelete(s)">Delete</button>
            </template>
          </div>
        </div>
      </template>
      <form class="src-form" @submit.prevent="srcSave()">
        <span class="fl-lbl" x-text="srcForm.id ? 'Edit source' : 'Add a source'"></span>
        <div class="src-form-row">
          <input type="text" x-ref="srcName" x-model="srcForm.name" placeholder="Client or activity" maxlength="100" aria-label="Source name" required>
          <input type="number" x-model="srcForm.hourly_rate" placeholder="rate" min="0.01" step="0.01" class="ctl-num" aria-label="Hourly rate" required>
          <select x-model="srcForm.currency" aria-label="Currency" class="src-cur">
            <option value="EUR">€ / h</option>
            <option value="USD">$ / h</option>
          </select>
          <button type="submit" class="btn-action" :disabled="!srcFormValid()" x-text="srcForm.id ? 'Save' : 'Add'"></button>
          <template x-if="srcForm.id">
            <button type="button" class="secondary outline compact" @click="srcReset()">Cancel</button>
          </template>
        </div>
      </form>
    </div>

    <!-- ── Accounts: where the payouts land ──────────────────────────────── -->
    <div class="settings-card" data-testid="accounts-card">
      <svg class="acct-sprite" width="0" height="0" aria-hidden="true" focusable="false">
        <defs>
          <symbol id="ac-bank" viewBox="0 0 24 24"><path d="M3.5 9.5 12 4l8.5 5.5M5.5 10v7.5M10 10v7.5M14 10v7.5M18.5 10v7.5M3.5 20h17" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
          <symbol id="ac-wallet" viewBox="0 0 24 24"><path d="M4 7.5c0-1.2 1-2 2.2-2H17M4 7.5v10c0 1.2 1 2 2.2 2h12.3c.8 0 1.5-.7 1.5-1.5V9.5c0-.8-.7-1.5-1.5-1.5H6.2C5 8 4 7.5 4 7.5Z M16.2 13.6h.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
          <symbol id="ac-cash" viewBox="0 0 24 24"><path d="M3.5 7.5h17v9h-17Z M12 14.6a2.6 2.6 0 1 0 0-5.2 2.6 2.6 0 0 0 0 5.2Z M6.5 10v.1M17.5 14v.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
          <symbol id="ac-other" viewBox="0 0 24 24"><path d="M12 4.5 19.5 12 12 19.5 4.5 12Z M12 10.8v.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
          <symbol id="ac-lock" viewBox="0 0 24 24"><path d="M7 11V8.5a5 5 0 0 1 10 0V11M5.5 11h13v8.5h-13Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
          <symbol id="ac-star" viewBox="0 0 24 24"><path d="m12 4.2 2.5 5.1 5.6.8-4.1 4 1 5.6L12 17l-5 2.7 1-5.6-4.1-4 5.6-.8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
        </defs>
      </svg>
      <div class="settings-card-head">
        <div>
          <h3>Accounts</h3>
        </div>
      </div>
      <template x-if="accounts.length === 0">
        <p class="muted settings-empty">Add the bank accounts or wallets your clients pay into. Without one, a payout is read in the currency you bill.</p>
      </template>
      <template x-for="a in acctRows()" :key="a.id">
        <div class="src-item acct-item" :class="a.archived ? 'is-archived' : ''" :data-account="a.name">
          <svg class="acct-kind" width="20" height="20" role="img" :aria-label="a.kind"><use :href="'#ac-' + a.kind"></use></svg>
          <div class="src-main">
            <strong x-text="a.name"></strong>
            <span class="metric acct-cur" :title="a.payouts ? acctUsedBy(a) : null">
              <span x-text="a.currency"></span>
              <svg x-show="a.payouts > 0" class="acct-lock" width="12" height="12" aria-hidden="true"><use href="#ac-lock"></use></svg>
            </span>
            <template x-if="a.archived"><span class="src-tag">archived</span></template>
          </div>
          <div class="src-actions">
            <template x-if="!a.archived">
              <button type="button" class="acct-star" :class="a.is_default ? 'on' : ''" @click="acctSetDefault(a)"
                :aria-pressed="a.is_default ? 'true' : 'false'" :aria-label="a.is_default ? 'Default account: ' + a.name : 'Make ' + a.name + ' the default account'"
                :title="a.is_default ? 'Default account' : 'Make default'">
                <svg width="16" height="16" aria-hidden="true"><use href="#ac-star"></use></svg>
              </button>
            </template>
            <button type="button" class="secondary outline compact" @click="acctEdit(a)" :aria-label="'Edit ' + a.name">Edit</button>
            <button type="button" class="secondary outline compact" @click="acctArchive(a, !a.archived)" :aria-label="(a.archived ? 'Restore ' : 'Archive ') + a.name" x-text="a.archived ? 'Restore' : 'Archive'"></button>
          </div>
        </div>
      </template>
      <form class="src-form" @submit.prevent="acctSave()">
        <span class="fl-lbl" x-text="acctForm.id ? 'Edit account' : 'Add an account'"></span>
        <div class="src-form-row">
          <input type="text" x-model="acctForm.name" placeholder="Bank or wallet" maxlength="60" aria-label="Account name" required>
          <span class="acct-picker" @click.outside="curOpen = false; curQuery = ''" :title="acctLocked() ? acctUsedBy(accountById(acctForm.id)) : null">
            <input type="text" role="combobox" class="acct-curin" autocomplete="off" aria-label="Account currency" aria-autocomplete="list"
              aria-controls="acct-curlist" :aria-expanded="curOpen ? 'true' : 'false'" :disabled="acctLocked()"
              :value="curOpen ? curQuery : curLabel(acctForm.currency)"
              @focus="curOpen = true; curQuery = ''; curIdx = 0; $el.select()"
              @input="curQuery = $event.target.value; curOpen = true; curIdx = 0" @keydown="curKey($event)">
            <ul id="acct-curlist" class="acct-curlist" role="listbox" aria-label="Currencies" x-show="curOpen">
              <template x-for="(c, i) in curOptions()" :key="c.code">
                <li role="option" :aria-selected="c.code === acctForm.currency ? 'true' : 'false'" :class="i === curIdx ? 'hot' : ''"
                  @mousedown.prevent="curPick(c)" @mouseenter="curIdx = i">
                  <b class="metric" x-text="c.code"></b> <span x-text="c.name"></span>
                </li>
              </template>
              <li class="muted none" x-show="curOptions().length === 0">No currency matches.</li>
            </ul>
          </span>
          <select x-model="acctForm.kind" aria-label="Account kind" class="src-cur">
            <option value="bank">Bank</option>
            <option value="wallet">Wallet</option>
            <option value="cash">Cash</option>
            <option value="other">Other</option>
          </select>
          <button type="submit" class="btn-action" :disabled="!acctFormValid()" x-text="acctForm.id ? 'Save' : 'Add'"></button>
          <template x-if="acctForm.id">
            <button type="button" class="secondary outline compact" @click="acctReset()">Cancel</button>
          </template>
        </div>
      </form>
    </div>

    <!-- ── Taxes, per year ───────────────────────────────────────────────── -->
    <div class="settings-card" id="settings-taxes" @input="taxTouched($event)" @change="taxTouched($event, true)">
      <div class="settings-card-head">
        <div>
          <h3>Taxes</h3>
          <p class="muted">What the year's estimate needs. A year without values of its own uses the latest earlier year's. Region: Andalucía. <a class="calc-link-inline" @click.prevent="openCalculator()" href="#freelance">See them in the calculator →</a></p>
        </div>
        <span class="settings-saved" :class="settingsStatusCls('taxes')" x-text="settingsStatusText('taxes')" aria-live="polite"></span>
      </div>
      <div class="srow">
        <span class="srow-key">Year
          <small x-text="taxOrigin()"></small></span>
        <div class="srow-ctl">
          <nav class="year-step" aria-label="Tax year">
        <button type="button" @click="switchTaxYear(taxYear - 1)" aria-label="Previous year">‹</button>
        <span class="year-step-v" x-text="taxYear"></span>
        <button type="button" @click="switchTaxYear(taxYear + 1)" aria-label="Next year">›</button>
      </nav>
        </div>
      </div>
      <template x-if="taxForm">
        <div>
          <div class="srow">
            <label class="srow-key" for="tax-salary">Gross salary of the job
              <small>Held at the same time (pluriactividad): the freelance income is taxed at the marginal rate on top of it. 0 if none.</small></label>
            <div class="srow-ctl">
              <input id="tax-salary" type="number" class="ctl-num ctl-money" x-model.number="taxForm.salary_annual" min="0" step="100">
              <span class="unit">€ / year</span>
            </div>
          </div>
          <div class="srow">
            <label class="srow-key" for="tax-plana">Tarifa plana
              <small>The flat RETA cuota of the first twelve months instead of the one by income tramo.</small></label>
            <div class="srow-ctl"><input id="tax-plana" type="checkbox" role="switch" x-model="taxForm.tarifa_plana"></div>
          </div>
          <div class="srow">
            <label class="srow-key" for="tax-startup">Start-up reduction
              <small>20 % off the net yield in the first two years with a positive yield. Lowers the Renta, not the quarterly 130.</small></label>
            <div class="srow-ctl"><input id="tax-startup" type="checkbox" role="switch" x-model="taxForm.inicio_actividad"></div>
          </div>
          <div class="srow">
            <label class="srow-key" for="tax-aside">Set aside
              <small>The share of every payment put by for the tax office. The dashboard card shows the month's.</small></label>
            <div class="srow-ctl">
              <input id="tax-aside" type="number" class="ctl-num" x-model.number="taxForm.set_aside_pct" min="0" max="100" step="1">
              <span class="unit">%</span>
            </div>
          </div>
          <div class="srow">
            <label class="srow-key" for="tax-gestoria">Gestoría
              <small>Deductible, per year.</small></label>
            <div class="srow-ctl">
              <input id="tax-gestoria" type="number" class="ctl-num ctl-money" x-model.number="taxForm.gestoria_annual" min="0" step="10">
              <span class="unit">€ / year</span>
            </div>
          </div>
          <div class="srow">
            <label class="srow-key" for="tax-other">Other deductible expenses
              <small>Software, hardware, a share of the connection… per year.</small></label>
            <div class="srow-ctl">
              <input id="tax-other" type="number" class="ctl-num ctl-money" x-model.number="taxForm.other_expenses" min="0" step="10">
              <span class="unit">€ / year</span>
            </div>
          </div>
          <p class="muted tax-note">
            Rules: <span x-text="taxForm.fiscal_year + ' figures, ' + taxForm.region + (taxForm.fiscal_year !== taxYear ? ' (no ' + taxYear + ' block in the fiscal file yet)' : '') + '.'"></span>
            Estimates for planning — check with an adviser.
            <template x-if="!taxForm.is_default && !taxForm.inherited_from && taxYear > 2000">
              <a @click.prevent="dropTaxYear()" class="tax-drop">Drop <span x-text="taxYear"></span>'s own values</a>
            </template>
          </p>
        </div>
      </template>
    </div>

    <!-- ── Projection ────────────────────────────────────────────────────── -->
    <form class="settings-card" id="settings-projection" @submit.prevent="saveSettings('projection')" @input="settingsTouched('projection', $event)" @change="settingsTouched('projection', $event, true)">
      <div class="settings-card-head">
        <div>
          <h3>Projection</h3>
          <p class="muted">How the Freelance tab carries the year to December 31: the hours you plan to bill a week, and the days you plan not to.</p>
        </div>
        <span class="settings-saved" :class="settingsStatusCls('projection')" x-text="settingsStatusText('projection')" aria-live="polite"></span>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-fl-hpw">Planned hours a week
          <small>At the rate realised so far this year, or the default source's before the first block.</small></label>
        <div class="srow-ctl">
          <input id="set-fl-hpw" type="number" class="ctl-num" x-model.number="settingsForm.freelance_hours_per_week" min="0" max="168" step="0.5">
          <span class="unit">h / week</span>
        </div>
      </div>
      <div class="srow">
        <label class="srow-key" for="set-fl-off">Days off a year
          <small>Days without freelance work — holidays, trips. Spread over the year.</small></label>
        <div class="srow-ctl">
          <input id="set-fl-off" type="number" class="ctl-num" x-model.number="settingsForm.freelance_days_off" min="0" max="366" step="1">
          <span class="unit">days</span>
        </div>
      </div>
    </form>

    <!-- ── Currency ──────────────────────────────────────────────────────── -->
    <div class="settings-card" id="settings-currency">
      <div class="settings-card-head">
        <div>
          <h3>Currency</h3>
          <p class="muted">Sources bill in euros or dollars; everything is added up in euros with the European Central Bank's reference rate.</p>
        </div>
        <button type="button" class="secondary outline compact fx-again" @click="loadFx(true)">Ask again</button>
      </div>
      <div class="srow">
        <span class="srow-key">EUR / USD today
          <small>This asks the European Central Bank.</small></span>
        <div class="srow-ctl">
          <span class="fx-pill metric" :class="fxInfo && fxInfo.available ? (fxInfo.stale ? 'stale' : 'ok') : 'off'" x-text="fxLabel()"></span>
        </div>
      </div>
      <div class="srow">
        <span class="srow-key">A dollar block
          <small>keeps the rate of its own day, taken once when it is saved (a weekend takes Friday's) and editable by hand from the Log tab (✎). It is never fetched again, so a later rate never moves an old amount.</small></span>
        <div class="srow-ctl"></div>
      </div>
    </div>
  </div>
  </template>

  <!-- ═══ General ════════════════════════════════════════════════════════ -->
  <template x-if="settingsGroup === 'general'">
  <div class="settings-cards">

    <!-- ── Fun zone: everything that moves data in bulk ──────────────────── -->
    <div class="settings-card fun-zone" id="settings-data">
      <div class="settings-card-head">
        <div>
          <h3 class="fun-zone-title">🎢 Fun zone</h3>
          <p class="muted">Everything that moves data in bulk. The two that destroy ask you to type first.</p>
        </div>
      </div>

      <div class="fun-zone-action">
        <div>
          <strong>Backup &amp; restore</strong>
          <p class="muted">Download a full snapshot — entries, planner drafts, freelance sources, blocks and tax years, settings — as JSON. Use <em>Restore</em> on any Kronos instance to migrate your data. <strong>Restore wipes the current database first.</strong></p>
        </div>
        <div class="backup-actions">
          <button type="button" class="secondary outline" @click="downloadBackup()">↓ Download backup</button>
          <button type="button" class="secondary outline" @click="$refs.restoreFileInput.click()">↑ Restore from file…</button>
          <input type="file" accept=".json,application/json" x-ref="restoreFileInput"
                 style="display:none" @change="restoreFromFile($event)">
        </div>
      </div>

      <hr class="fun-zone-divider">

      <div class="fun-zone-action">
        <div>
          <strong>Import CSV</strong>
          <p class="muted">Adds historical days from a Kronos CSV export — existing dates are skipped and nothing is wiped. The freelance blocks have their own CSV (Analytics → Export); they travel in the backup.</p>
        </div>
        <div class="backup-actions">
          <button type="button" class="secondary outline" @click="$refs.importCsvInput.click()">⇪ Import CSV…</button>
          <input type="file" accept=".csv,text/csv" x-ref="importCsvInput"
                 style="display:none" @change="importCsvFromFile($event)">
        </div>
      </div>

      <hr class="fun-zone-divider">

      <div class="fun-zone-action">
        <div>
          <strong>Seed with sample data</strong>
          <p class="muted">Wipe all entries and repopulate with ~3 months of realistic sample days. Useful for demos or resetting after experiments. Settings are kept.</p>
        </div>

        <template x-if="!seedConfirming">
          <button type="button" class="secondary outline" @click="seedConfirming = true; seedInput = ''">
            Seed sample data…
          </button>
        </template>

        <template x-if="seedConfirming">
          <div class="wipe-confirm" x-init="$nextTick(() => $el.querySelector('input[type=text]').focus())">
            <label class="wipe-confirm-label">
              Type <code>seed data</code> to confirm
              <input type="text" x-model="seedInput"
                     placeholder="seed data"
                     autocomplete="off"
                     spellcheck="false">
            </label>
            <div class="wipe-confirm-actions">
              <button type="button" class="secondary"
                      :disabled="seedInput !== 'seed data'"
                      @click="seedData()">
                Confirm seed
              </button>
              <button type="button" class="secondary outline"
                      @click="seedConfirming = false; seedInput = ''">
                Cancel
              </button>
            </div>
          </div>
        </template>
      </div>

      <hr class="fun-zone-divider">

      <div class="fun-zone-action">
        <div>
          <strong>Wipe all data</strong>
          <p class="muted">Permanently delete every logged day and break, every planner draft and every freelance block. Your settings (daily target, cumulative start date, income sources, tax years) are kept. <strong>This cannot be undone.</strong></p>
        </div>

        <template x-if="!wipeConfirming">
          <button type="button" class="btn-danger outline" @click="wipeConfirming = true; wipeInput = ''">
            Wipe all data…
          </button>
        </template>

        <template x-if="wipeConfirming">
          <div class="wipe-confirm" x-init="$nextTick(() => $el.querySelector('input[type=text]').focus())">
            <label class="wipe-confirm-label">
              Type <code>wipe data</code> to confirm
              <input type="text" x-model="wipeInput"
                     placeholder="wipe data"
                     autocomplete="off"
                     spellcheck="false">
            </label>
            <div class="wipe-confirm-actions">
              <button type="button" class="btn-danger"
                      :disabled="wipeInput !== 'wipe data'"
                      @click="wipeData()">
                Confirm wipe
              </button>
              <button type="button" class="secondary outline"
                      @click="wipeConfirming = false; wipeInput = ''">
                Cancel
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
  </template>

  </div><!-- /settings-content -->
</section>
</template>
