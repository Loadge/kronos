<!-- ========================= DASHBOARD ========================= -->
<template x-if="tab==='dashboard'">
<section aria-label="Dashboard">

  <!-- skeleton while the first load is in flight -->
  <template x-if="!dashboard">
    <div aria-hidden="true" class="hero">
      <div>
        <div class="skel-line skel-title"></div>
        <div class="skel-metric-ph skel-hero-ph"></div>
        <div class="skel-line skel-sub"></div>
      </div>
      <div class="skel-traj"></div>
    </div>
  </template>

  <template x-if="dashboard">
    <div>
      <!-- Hero: the cumulative balance, and the year's trajectory next to it.
           No prose — the start date, the target and today are captions and a chip;
           the forecast is the dashed tail of the chart. -->
      <div class="hero">
        <div class="hero-text" :title="daysTitle(dashboard.cumulative)">
          <div class="hero-label">
            <span>Cumulative · since <span x-text="sinceLabel()"></span></span>
            <span class="today-chip" x-text="todayChip()" :title="'Today is ' + dashboard.today"></span>
          </div>
          <div class="hero-num metric" :class="surplusClass(dashboard.cumulative.surplus_hours)" aria-live="polite">
            <span x-text="dashboard.cumulative.surplus_hours > 0.01 ? '+' : dashboard.cumulative.surplus_hours < -0.01 ? '−' : '±'"></span><span x-text="animCumulative.toFixed(2)"></span>h
          </div>
          <div class="hero-cap">
            <b x-text="dashboard.cumulative.net_hours + 'h'"></b> worked /
            <b x-text="dashboard.cumulative.target_hours + 'h'"></b> target
            · <span x-text="dashboard.daily_target_hours + 'h a day'"></span>
          </div>
        </div>
        <!-- The trajectory is built as markup in app.js (buildTrajectory): Alpine's x-for needs
             an HTML <template>, which the parser turns into an SVG element inside <svg>. -->
        <div class="traj-wrap" x-html="traj.svg" x-effect="traj.svg; $nextTick(() => animateTrajectory($el))"
             role="img" :aria-label="traj.aria"></div>
      </div>

      <!-- Week · month · vs last year: the three numbers the dashboard is read for. -->
      <div class="chips">
        <div class="chip" :title="daysTitle(dashboard.week)">
          <span class="chip-label">this week</span>
          <span class="chip-sub" x-text="dashboard.week.net_hours + 'h / ' + dashboard.week.target_hours + 'h'"></span>
          <span class="chip-value metric" :class="surplusClass(dashboard.week.surplus_hours)">
            <span x-text="dashboard.week.surplus_hours > 0.01 ? '+' : dashboard.week.surplus_hours < -0.01 ? '−' : '±'"></span><span x-text="animWeek.toFixed(2)"></span>h
          </span>
          <span class="bullet"><i :class="surplusClass(dashboard.week.surplus_hours)" :style="bulletStyle(dashboard.week.surplus_hours, 10)"></i></span>
        </div>
        <button type="button" class="chip chip--link" @click="go('analytics')" :title="daysTitle(dashboard.month) + ' — open Analytics'">
          <span class="chip-label">this month</span>
          <span class="chip-sub" x-text="dashboard.month.net_hours + 'h / ' + dashboard.month.target_hours + 'h'"></span>
          <span class="chip-value metric" :class="surplusClass(dashboard.month.surplus_hours)">
            <span x-text="dashboard.month.surplus_hours > 0.01 ? '+' : dashboard.month.surplus_hours < -0.01 ? '−' : '±'"></span><span x-text="animMonth.toFixed(2)"></span>h
          </span>
          <span class="bullet"><i :class="surplusClass(dashboard.month.surplus_hours)" :style="bulletStyle(dashboard.month.surplus_hours, 20)"></i></span>
        </button>
        <button type="button" class="chip chip--link" @click="go('analytics')" title="This year against the same period last year — open Analytics">
          <span class="chip-label">vs last year</span>
          <template x-if="yoy">
            <span class="chip-sub" x-text="yoy.last_year.label.slice(0, 4) + ' to date: ' + formatSurplus(yoy.last_year.surplus_hours)"></span>
          </template>
          <template x-if="yoy">
            <span class="chip-value metric" :class="surplusClass(yoyDelta())" x-text="formatSurplus(yoyDelta())"></span>
          </template>
          <template x-if="!yoy">
            <span class="chip-value metric neutral">—</span>
          </template>
          <span class="bullet"><i :class="surplusClass(yoyDelta())" :style="bulletStyle(yoyDelta(), 20)"></i></span>
        </button>
      </div>

      <!-- This week, day by day: the old Week tab, as a strip of tiny bar charts.
           Always the current week; a day opens in Log. -->
      <div class="wk">
        <div class="wk-head">
          <h3>This week · <span x-text="weekLabel()"></span></h3>
          <span class="wk-total metric" :class="surplusClass(weekSummary().surplus)">
            <span x-text="formatSurplus(weekSummary().surplus)"></span>
            <span class="muted" x-text="'· ' + weekSummary().net + 'h of ' + weekSummary().target + 'h'"></span>
          </span>
        </div>
        <div class="wk-grid">
          <template x-for="d in weekDays()" :key="d.iso">
            <button type="button" class="wd"
                    :class="{ 'wd--today': d.isToday, 'wd--weekend': d.isWeekend, 'wd--empty': !d.entry }"
                    @click="weekSelectDay(d.iso)"
                    :aria-label="d.label + ' ' + d.iso + (d.entry ? '' : ' — no entry, click to log')">
              <span class="wd-top">
                <span class="wd-dow" x-text="d.label"></span>
                <span class="wd-num" x-text="d.dayNum"></span>
              </span>
              <span class="wd-chart" :class="d.isWeekend && !d.entry && !d.draft ? 'wd-chart--off' : ''">
                <span class="wd-target" :style="'bottom:' + weekBarPct(d.target) + '%'" x-show="d.target > 0"></span>
                <template x-if="d.entry">
                  <span class="wd-bar" :class="d.cls" :style="d.style + ';height:' + weekBarPct(d.barHours) + '%'"></span>
                </template>
                <template x-if="!d.entry && d.draft">
                  <span class="wd-bar wd-bar--ghost" :class="d.cls" :style="'height:' + weekBarPct(d.target) + '%'"></span>
                </template>
              </span>
              <span class="wd-foot">
                <template x-if="d.entry && d.entry.day_type === 'work'">
                  <span class="wd-nums"><span class="wd-net" x-text="d.entry.net_hours + 'h'"></span><span class="wd-delta" :class="surplusClass(d.entry.surplus_hours)" x-text="formatSurplus(d.entry.surplus_hours).replace('h', '')"></span></span>
                </template>
                <template x-if="d.entry && d.entry.day_type !== 'work'">
                  <span class="wd-nums">
                    <span class="day-pill" :class="d.entry.day_type" x-text="pillLabel(d.entry)"></span>
                    <template x-if="isPartial(d.entry)">
                      <span class="wd-delta" :class="surplusClass(d.entry.surplus_hours)" x-text="d.entry.net_hours + 'h ' + formatSurplus(d.entry.surplus_hours).replace('h', '')"></span>
                    </template>
                  </span>
                </template>
                <template x-if="!d.entry && d.draft">
                  <span class="day-pill ghost" :class="d.draft.day_type" x-text="d.draft.day_type"></span>
                </template>
                <template x-if="!d.entry && !d.draft">
                  <span class="wd-dash" x-text="d.isFuture ? '·' : '—'"></span>
                </template>
              </span>
            </button>
          </template>
        </div>

        <!-- Quick-log: only while today has no entry. Once logged it is gone. -->
        <div class="quick-log" x-show="!todayEntry()">
          <span class="quick-log-label muted">Quick-log today:</span>
          <template x-for="t in templates" :key="t.id">
            <button type="button" class="quick-log-btn ql-work" @click="quickLogTemplate(t)">
              <span x-text="t.name"></span>
            </button>
          </template>
          <button type="button" class="quick-log-btn ql-vacation" @click="quickLogNonWork('vacation')">Vacation</button>
          <button type="button" class="quick-log-btn ql-sick" @click="quickLogNonWork('sick')">Sick</button>
          <button type="button" class="quick-log-btn ql-holiday" @click="quickLogNonWork('holiday')">Holiday</button>
          <button type="button" class="quick-log-btn ql-flex" @click="quickLogNonWork('flex')">Flex</button>
        </div>
      </div>

      <!-- Vacation budget as notches: filled = used, dashed = planned, hollow = left. -->
      <template x-if="vacationStatus()">
        <div class="vac">
          <span class="vac-label">🏖 Vacation</span>
          <span class="vac-notches" :title="vacationStatus().used + ' of ' + vacationStatus().budget + ' days used'">
            <template x-for="n in vacationNotches()" :key="n.i">
              <i :class="'vac-' + n.kind" :style="n.style"></i>
            </template>
          </span>
          <span class="vac-sub">
            <span x-text="fmtDays(vacationStatus().used) + ' used'"></span>
            <template x-if="plannedVacationDays() > 0"><span x-text="' · ' + fmtDays(plannedVacationDays()) + ' planned'"></span></template>
            <span x-text="' · ' + fmtDays(vacationLeftAfterPlan()) + ' left of ' + fmtDays(vacationStatus().budget)"></span>
          </span>
        </div>
      </template>

      <template x-if="streakStats">
        <div class="streak-line">
          <span>🔥 <b x-text="streakStats.logging_streak + 'd'"></b> logging · <span x-text="streakStats.total_logged_days + ' all-time'"></span></span>
          <span>🎯 <b :class="streakStats.on_target_streak > 0 ? 'surplus' : ''" x-text="streakStats.on_target_streak + 'd'"></b> on target</span>
        </div>
      </template>

      <!-- Streaks panel — unlocked by typing "kronos" anywhere -->
      <template x-if="streaksUnlocked && streaks">
        <div class="streaks-panel">
          <h3>🎢 Streaks</h3>
          <div class="streaks-row">
            <div class="streak-item">
              <span class="streak-label">Longest surplus streak</span>
              <span class="streak-value" x-text="streaks.longestSurplus"></span>
              <span class="streak-unit">days</span>
            </div>
            <div class="streak-item">
              <span class="streak-label">Longest deficit streak</span>
              <span class="streak-value" x-text="streaks.longestDeficit"></span>
              <span class="streak-unit">days</span>
            </div>
            <div class="streak-item">
              <span class="streak-label">Most breaks in a day</span>
              <span class="streak-value" x-text="streaks.mostBreaks"></span>
            </div>
          </div>
        </div>
      </template>
    </div>
  </template>
</section>
</template>
