<!-- ========================= ANALYTICS ========================= -->
<template x-if="tab==='analytics'">
<section aria-label="Analytics" @mouseleave="hmTip.show = false">

  <!-- ── Year at a glance: always a whole year; hover a day, click to open it in Log ── -->
  <div class="section-header an-head">
    <h2>Year at a glance</h2>
    <div class="section-header-controls">
      <span class="muted an-hint">hover a day · click to open it in Log</span>
      <select x-model="analyticsYear" class="an-year" aria-label="Year">
        <template x-for="y in yearsWithData()" :key="y">
          <option :value="y" x-text="y"></option>
        </template>
      </select>
    </div>
  </div>
  <template x-if="heatmapCells()">
    <div>
      <div class="heatmap-legend">
        <span class="legend-item"><span class="hm-swatch hm-surplus"></span> Surplus</span>
        <span class="legend-item"><span class="hm-swatch hm-deficit"></span> Deficit</span>
        <span class="legend-item"><span class="hm-swatch hm-neutral"></span> On target</span>
        <span class="legend-item"><span class="hm-swatch hm-vacation"></span> Vacation</span>
        <span class="legend-item"><span class="hm-swatch hm-sick"></span> Sick</span>
        <span class="legend-item"><span class="hm-swatch hm-holiday"></span> Holiday</span>
        <span class="legend-item"><span class="hm-swatch hm-flex"></span> Flex</span>
        <span class="legend-item"><span class="hm-swatch hm-partial-swatch"></span> Partial</span>
        <span class="legend-item"><span class="hm-swatch hm-ghost hm-ghost-vacation"></span> Planned</span>
        <span class="legend-item"><span class="hm-swatch hm-empty"></span> No entry</span>
      </div>
      <div class="heatmap-scroll">
        <div class="heatmap"
             :style="`grid-template-columns: ${heatmapCells().colTemplate}`"
             @mousemove="hmHover($event)" @mouseleave="hmTip.show = false" @click="hmClick($event)">
          <template x-for="cell in heatmapCells().cells" :key="cell.key">
            <div :class="cell.type === 'label' ? 'hm-month-label' : cell.type === 'week' ? 'hm-week-label' : 'hm-cell ' + cell.cls + (cell.weekend ? ' hm-weekend' : '') + (cell.today ? ' hm-today' : '')"
                 :style="`grid-row: ${cell.row}; grid-column: ${cell.col};` + (cell.style || '')"
                 :aria-label="cell.title || null"
                 :data-date="cell.type === 'day' ? cell.date : null"
                 x-text="cell.type === 'label' || cell.type === 'week' ? cell.label : ''"></div>
          </template>
        </div>
      </div>
    </div>
  </template>
  <template x-if="!heatmapCells()">
    <p class="muted">No entries yet. <a @click.prevent="go('log')">Log your first day</a>.</p>
  </template>
  <!-- the day tooltip: follows the pointer over the heatmap -->
  <div class="hm-tip" x-show="hmTip.show" :style="`left:${hmTip.x}px;top:${hmTip.y}px`" role="tooltip">
    <b x-text="hmTip.title"></b>
    <div x-html="hmTip.body"></div>
    <template x-if="hmTip.note"><i class="hm-tip-note" x-text="hmTip.note"></i></template>
    <span class="hm-tip-hint" x-text="hmTip.hint"></span>
  </div>

  <!-- ── Balance over time: the zoomable chart, with the visible range as a ledger ── -->
  <div class="section-header an-head">
    <h2>Balance over time</h2>
    <span class="muted an-hint">drag a rectangle to zoom · wheel to zoom at the cursor · shift+drag to pan · double-click to reset</span>
  </div>
  <div class="an-row">
    <div class="an-chart-col">
      <div class="an-chart-head">
        <div class="seg-toggle" role="radiogroup" aria-label="Series">
          <button type="button" role="radio" :aria-checked="an.mode === 'balance' ? 'true' : 'false'" :class="an.mode === 'balance' ? 'on' : ''" @click="anSetMode('balance')">Balance</button>
          <button type="button" role="radio" :aria-checked="an.mode === 'day' ? 'true' : 'false'" :class="an.mode === 'day' ? 'on' : ''" @click="anSetMode('day')">Per day</button>
          <button type="button" role="radio" :aria-checked="an.mode === 'month' ? 'true' : 'false'" :class="an.mode === 'month' ? 'on' : ''" @click="anSetMode('month')">Per month</button>
        </div>
        <span class="an-range metric" x-text="anRangeLabel()"></span>
        <button type="button" class="secondary outline compact an-reset" @click="anPreset('year')" :disabled="an.preset !== null">Reset zoom</button>
      </div>
      <!-- Built as markup (x-for cannot live inside <svg>); pointer events attached once by anInit. -->
      <div class="an-chart-wrap" x-init="anInit($el)" x-html="anChart.svg" role="img" :aria-label="anChart.aria"></div>
      <!-- the whole history under the chart, with the visible window on it: drag it to pan -->
      <div class="an-brush" x-ref="anBrush" title="The whole history — drag the window to pan">
        <div class="an-brush-svg" x-html="anChart.brush"></div>
        <div class="an-brush-win" :style="anBrushWinStyle()"></div>
      </div>
    </div>
    <aside class="an-ledger" aria-label="Range">
      <h3>Range</h3>
      <div class="an-presets" role="radiogroup" aria-label="Range presets">
        <template x-for="p in AN_PRESETS" :key="p.id">
          <button type="button" role="radio" :aria-checked="an.preset === p.id ? 'true' : 'false'" :class="an.preset === p.id ? 'on' : ''" @click="anPreset(p.id)" x-text="p.label"></button>
        </template>
      </div>
      <template x-if="anSummary()">
        <div class="an-ledger-rows">
          <div class="an-lrow an-lrow--big"><span>Balance</span><b class="metric" :class="surplusClass(anSummary().surplus)" x-text="formatSurplus(anSummary().surplus)"></b></div>
          <div class="an-lrow"><span>Net worked</span><b class="metric" x-text="anSummary().net + 'h'"></b></div>
          <div class="an-lrow"><span>Target</span><b class="metric" x-text="anSummary().target + 'h'"></b></div>
          <div class="an-lrow"><span>Per work day</span><b class="metric" :class="surplusClass(anSummary().perDay)" x-text="anSummary().workDays ? formatSurplus(anSummary().perDay) : '—'"></b></div>
          <div class="an-lrow"><span>Work days</span><b class="metric" x-text="fmtDays(anSummary().workDays)"></b></div>
          <div class="an-lrow"><span>Off</span><b class="metric" x-text="fmtDays(anSummary().offDays)"></b></div>
          <div class="an-lrow"><span>Vacation · sick</span><b class="metric" x-text="fmtDays(anSummary().vacation) + ' · ' + fmtDays(anSummary().sick)"></b></div>
          <div class="an-lrow"><span>Logged days</span><b class="metric" x-text="anSummary().logged"></b></div>
        </div>
      </template>
    </aside>
  </div>

  <div class="an-two">
    <div>
      <div class="section-header an-head">
        <h2>Weekday pattern</h2>
        <span class="muted an-hint">for the range shown</span>
      </div>
      <template x-if="weekdayPattern()">
        <div>
          <div class="weekday-grid">
            <template x-for="cell in weekdayPattern()" :key="cell.label">
              <div class="weekday-cell" :title="cell.title">
                <div class="weekday-bar">
                  <template x-if="cell.avg !== null">
                    <i :class="cell.avg >= 0 ? 'up' : 'down'" :style="cell.barStyle"></i>
                  </template>
                </div>
                <div class="weekday-label" x-text="cell.label"></div>
                <div class="weekday-avg"
                     :class="cell.avg !== null ? surplusClass(cell.avg) : 'muted'"
                     x-text="cell.text"></div>
                <div class="weekday-times metric" x-text="cell.times"></div>
              </div>
            </template>
          </div>
          <p class="muted chart-caption">Δ per work day, and the average start → end. When do I really arrive and leave?</p>
        </div>
      </template>
      <template x-if="!weekdayPattern()">
        <p class="muted">No work days in this range.</p>
      </template>
    </div>
    <div>
      <div class="section-header an-head">
        <h2>Daily surplus</h2>
        <span class="muted an-hint">for the range shown</span>
      </div>
      <template x-if="anHistogram()">
        <div>
          <div class="an-hist">
            <template x-for="b in anHistogram().buckets" :key="b.lo">
              <i :class="b.lo >= 0 ? 'up' : 'down'" :style="'height:' + b.pct + '%'" :title="b.title"></i>
            </template>
          </div>
          <div class="an-hist-x metric"><span>−3h</span><span>−2h</span><span>−1h</span><span>0</span><span>+1h</span><span>+2h</span><span>+3h</span></div>
          <p class="muted chart-caption" x-text="anHistogram().caption"></p>
        </div>
      </template>
      <template x-if="!anHistogram()">
        <p class="muted">No work days in this range.</p>
      </template>
    </div>
  </div>

  <h2 class="an-h2">Years</h2>
  <template x-if="yearly.length === 0">
    <p class="muted">No data yet.</p>
  </template>
  <div class="table-wrap" x-show="yearly.length">
    <table class="an-years">
      <thead>
        <tr>
          <th>Year</th>
          <th class="num">Net</th>
          <th class="num">Target</th>
          <th class="num">Δ</th>
          <th class="num" title="Accumulated surplus carried in from all prior years">Carry-in</th>
          <th class="num">Work days</th>
          <th class="num">Off days</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in yearlyWithCarryover()" :key="row.year">
          <tr>
            <td class="metric" x-text="row.label"></td>
            <td class="num metric" x-text="row.net_hours + 'h'"></td>
            <td class="num metric" x-text="row.target_hours + 'h'"></td>
            <td class="num metric" :class="surplusClass(row.surplus_hours)"
                x-text="formatSurplus(row.surplus_hours)"></td>
            <td class="num metric" :class="surplusClass(row.carry_in)"
                x-text="row.carry_in !== 0 ? formatSurplus(row.carry_in) : '—'"></td>
            <td class="num metric" x-text="row.work_days"></td>
            <td class="num metric" x-text="row.non_work_days"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="section-header an-head">
    <h2>Records</h2>
    <span class="muted an-hint">for the range shown</span>
  </div>
  <template x-if="anRecords().length">
    <div class="an-records">
      <template x-for="r in anRecords()" :key="r.label">
        <div class="an-rec">
          <span class="an-rec-label" x-text="r.label"></span>
          <span><b class="metric" :class="r.cls || ''" x-text="r.value"></b><span class="an-rec-when metric" x-text="r.when"></span></span>
        </div>
      </template>
    </div>
  </template>
  <template x-if="!anRecords().length">
    <p class="muted">Nothing logged in this range.</p>
  </template>

  <h2 class="an-h2">Export</h2>
  <p class="an-export">
    <a href="/api/export.csv" role="button" class="secondary outline" download>Download CSV</a>
    <a href="/api/export.json" role="button" class="secondary outline" download>Download JSON</a>
  </p>
</section>
</template>
