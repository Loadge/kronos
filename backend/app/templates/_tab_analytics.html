<!-- ========================= YEAR (tab id "analytics", address #year) ========================= -->
<template x-if="tab==='analytics'">
<section aria-label="Year" @mouseleave="hmTip.show = false" x-init="anPinInit($el)">

  <header class="page-head">
    <div class="page-head-title"><h2>Year</h2></div>
    <div class="page-head-controls">
      <!-- the exports: pills in the head, before the Employee/Freelance switch and the year -->
      <a href="/api/export.csv" role="button" class="head-btn" download>CSV</a>
      <a href="/api/export.json" role="button" class="head-btn" download>JSON</a>
      <template x-if="hasFreelance()">
        <a href="/api/freelance/export.csv" role="button" class="head-btn" download><span aria-hidden="true">⚡</span> Freelance CSV</a>
      </template>
      <template x-if="hasFreelance()">
        <a href="/api/freelance/payouts.csv" role="button" class="head-btn" download><span aria-hidden="true">⚡</span> Payouts CSV</a>
      </template>
      <template x-if="hasFreelance()">
        <div class="seg-toggle hm-switch" role="radiogroup" aria-label="Heatmap shows">
          <button type="button" role="radio" :aria-checked="hmMode === 'employee' ? 'true' : 'false'" :class="hmMode === 'employee' ? 'on' : ''" @click="hmMode = 'employee'"><span aria-hidden="true">👔</span> Employee</button>
          <button type="button" role="radio" :aria-checked="hmMode === 'freelance' ? 'true' : 'false'" :class="hmMode === 'freelance' ? 'on' : ''" @click="hmMode = 'freelance'"><span aria-hidden="true">⚡</span> Freelance</button>
        </div>
      </template>
      <nav class="year-step" aria-label="Year selector">
        <button type="button" @click="anStepYear(-1)" aria-label="Previous year">‹</button>
        <span class="year-step-v" x-text="analyticsYear"></span>
        <button type="button" @click="anStepYear(1)" aria-label="Next year">›</button>
      </nav>
    </div>
  </header>

  <!-- ── Year at a glance: always a whole year; hover a day, click to open it in Log.
       Once it has scrolled out of view, a compact copy stays pinned at the top (below). ── -->
  <div class="an-glance" data-testid="an-glance">
  <div class="section-header an-head" title="Hover a day, click to open it in Days">
    <h2>Year at a glance</h2>
  </div>
  <template x-if="heatmapCells()">
    <div>
      <div class="heatmap-legend" x-show="hmMode === 'freelance' && hasFreelance()">
        <span class="legend-item"><span class="hm-swatch hm-fl hm-fl-1"></span> under 1h</span>
        <span class="legend-item"><span class="hm-swatch hm-fl hm-fl-2"></span> 1–2h</span>
        <span class="legend-item"><span class="hm-swatch hm-fl hm-fl-3"></span> 2–4h</span>
        <span class="legend-item"><span class="hm-swatch hm-fl hm-fl-4"></span> 4h and more</span>
        <span class="legend-item"><span class="hm-swatch hm-empty"></span> No freelance</span>
      </div>
      <div class="heatmap-legend" x-show="!(hmMode === 'freelance' && hasFreelance())">
        <span class="legend-item"><span class="hm-swatch hm-surplus"></span> Surplus</span>
        <span class="legend-item"><span class="hm-swatch hm-deficit"></span> Deficit</span>
        <span class="legend-item"><span class="hm-swatch hm-neutral"></span> On target</span>
        <span class="legend-item"><span class="hm-swatch hm-vacation"></span> Vacation</span>
        <span class="legend-item"><span class="hm-swatch hm-sick"></span> Sick</span>
        <span class="legend-item"><span class="hm-swatch hm-holiday"></span> Holiday</span>
        <span class="legend-item"><span class="hm-swatch hm-flex"></span> Flex</span>
        <span class="legend-item"><span class="hm-swatch hm-partial-swatch"></span> Partial</span>
        <span class="legend-item"><span class="hm-swatch hm-ghost hm-ghost-vacation"></span> Planned</span>
        <span class="legend-item"><span class="hm-swatch hm-empty"></span> No entry</span>
      </div>
      <div class="heatmap-scroll" tabindex="0" role="region" aria-label="Year at a glance"
           x-init="anHeatmapStart($el)" @scroll.passive="anHeatmapFade($el)">
        <div class="heatmap"
             :style="`grid-template-columns: ${heatmapCells().colTemplate}`"
             @mousemove="hmHover($event)" @mouseleave="hmTip.show = false" @click="hmClick($event)">
          <template x-for="cell in heatmapCells().cells" :key="cell.key">
            <div :class="cell.type === 'label' ? 'hm-month-label' : cell.type === 'week' ? 'hm-week-label' : 'hm-cell ' + cell.cls + (cell.weekend ? ' hm-weekend' : '') + (cell.today ? ' hm-today' : '')"
                 :style="`grid-row: ${cell.row}; grid-column: ${cell.col};` + (cell.style || '')"
                 :role="cell.title ? 'img' : null" :aria-label="cell.title || null"
                 :data-date="cell.type === 'day' ? cell.date : null"
                 x-text="cell.type === 'label' || cell.type === 'week' ? cell.label : ''"></div>
          </template>
        </div>
      </div>
    </div>
  </template>
  <template x-if="!heatmapCells()">
    <p class="muted">No entries yet. <a @click.prevent="go('log')">Log a day</a>.</p>
  </template>
  </div><!-- /an-glance -->

  <!-- The pinned copy: fixed to the top once the year has scrolled away, so it takes no room
       in the page (a sticky block that shrinks would change the page's height under the
       scroll and bounce). 4px days, the switch and the year at hand; a click goes back up. -->
  <div class="an-minibar" x-show="anStuck" x-transition.opacity.duration.150ms data-testid="an-pin" role="region" aria-label="Year at a glance, pinned">
    <div class="an-minibar-in">
      <button type="button" class="an-minibar-title" @click="anUnstick()" title="Back to the full year">Year at a glance <span aria-hidden="true">↑</span></button>
      <template x-if="heatmapCells()">
        <div class="heatmap heatmap--mini" :style="`grid-template-columns: ${heatmapCells().colTemplate}`" @click="anUnstick()" title="Back to the full year">
          <template x-for="cell in heatmapCells().cells.filter(c => c.type === 'day')" :key="'m' + cell.key">
            <div :class="'hm-cell ' + cell.cls + (cell.today ? ' hm-today' : '')" :style="`grid-row: ${cell.row}; grid-column: ${cell.col};` + (cell.style || '')"></div>
          </template>
        </div>
      </template>
      <div class="an-minibar-ctl">
      <template x-if="hasFreelance()">
        <div class="seg-toggle hm-switch" role="radiogroup" aria-label="Heatmap shows">
          <button type="button" role="radio" :aria-checked="hmMode === 'employee' ? 'true' : 'false'" :class="hmMode === 'employee' ? 'on' : ''" @click="hmMode = 'employee'"><span aria-hidden="true">👔</span> Employee</button>
          <button type="button" role="radio" :aria-checked="hmMode === 'freelance' ? 'true' : 'false'" :class="hmMode === 'freelance' ? 'on' : ''" @click="hmMode = 'freelance'"><span aria-hidden="true">⚡</span> Freelance</button>
        </div>
      </template>
      <nav class="year-step" aria-label="Year selector">
        <button type="button" @click="anStepYear(-1)" aria-label="Previous year">‹</button>
        <span class="year-step-v" x-text="analyticsYear"></span>
        <button type="button" @click="anStepYear(1)" aria-label="Next year">›</button>
      </nav>
      </div>
    </div>
  </div>
  <!-- the day tooltip: follows the pointer over the heatmap -->
  <div class="hm-tip" x-show="hmTip.show" :style="`left:${hmTip.x}px;top:${hmTip.y}px`" role="tooltip">
    <b x-text="hmTip.title"></b>
    <div x-html="hmTip.body"></div>
    <template x-if="hmTip.note"><i class="hm-tip-note" x-text="hmTip.note"></i></template>
    <span class="hm-tip-hint" x-text="hmTip.hint"></span>
  </div>

  <!-- ── Balance over time: the zoomable chart, with the visible range as a ledger ── -->
  <div class="section-header an-head q-host">
    <h2><span aria-hidden="true">👔</span> Balance over time</h2>
    <button type="button" class="q-chip" data-tip="Drag to zoom into a range&#10;Wheel to zoom at the cursor&#10;Shift-drag to pan&#10;Double-click to reset"
            title="Drag to zoom into a range&#10;Wheel to zoom at the cursor&#10;Shift-drag to pan&#10;Double-click to reset"
            aria-label="Chart controls: drag to zoom, wheel to zoom, shift-drag to pan, double-click to reset"
            @click="$el.classList.toggle('open')" @click.outside="$el.classList.remove('open')" @keydown.escape="if ($el.classList.contains('open')) { $event.stopPropagation(); $el.classList.remove('open') }">?</button>
  </div>
  <div class="an-row">
    <div class="an-chart-col">
      <div class="an-chart-head">
        <div class="seg-toggle" role="radiogroup" aria-label="Series">
          <button type="button" role="radio" :aria-checked="an.mode === 'balance' ? 'true' : 'false'" :class="an.mode === 'balance' ? 'on' : ''" @click="anSetMode('balance')">Balance</button>
          <button type="button" role="radio" :aria-checked="an.mode === 'day' ? 'true' : 'false'" :class="an.mode === 'day' ? 'on' : ''" @click="anSetMode('day')">Per day</button>
          <button type="button" role="radio" :aria-checked="an.mode === 'month' ? 'true' : 'false'" :class="an.mode === 'month' ? 'on' : ''" @click="anSetMode('month')">Per month</button>
          <template x-if="hasFreelance()">
            <button type="button" role="radio" :aria-checked="an.mode === 'income' ? 'true' : 'false'" :class="an.mode === 'income' ? 'on' : ''" @click="anSetMode('income')">⚡ Income</button>
          </template>
        </div>
        <span class="an-range metric" x-text="anRangeLabel()"></span>
        <button type="button" class="secondary outline compact an-reset" @click="anPreset('year')" :disabled="an.preset !== null">Reset zoom</button>
      </div>
      <!-- Built as markup (x-for cannot live inside <svg>); pointer events attached once by anInit. -->
      <div class="an-chart-wrap" x-init="anInit($el)" x-html="anChart.svg" role="img" :aria-label="anChart.aria"
           title="Drag to zoom into a range&#10;Wheel to zoom at the cursor&#10;Shift-drag to pan&#10;Double-click to reset"></div>
      <!-- the whole history under the chart, with the visible window on it: drag it to pan -->
      <div class="an-brush" x-ref="anBrush" title="The whole history — drag the window to pan">
        <div class="an-brush-svg" x-html="anChart.brush"></div>
        <div class="an-brush-win" :style="anBrushWinStyle()"></div>
      </div>
      <!-- Weekday pattern and Daily surplus sit under the brush, side by side: the aside (with a
           freelance block) is the taller column, and these two panels take the spare height. -->
      <div class="an-panels">
        <section class="an-panel" aria-labelledby="an-weekday-h">
          <h2 id="an-weekday-h">Weekday pattern</h2>
          <template x-if="weekdayPattern()">
            <div class="weekday-grid" role="group" aria-label="Δ per work day, and the average start → end. When do I really arrive and leave?" title="Δ per work day, and the average start → end. When do I really arrive and leave?">
              <template x-for="cell in weekdayPattern()" :key="cell.label">
                <div class="weekday-cell" :title="cell.title">
                  <div class="weekday-bar">
                    <template x-if="cell.avg !== null">
                      <i :class="cell.avg >= 0 ? 'up' : 'down'" :style="cell.barStyle"></i>
                    </template>
                  </div>
                  <div class="weekday-label" x-text="cell.label"></div>
                  <div class="weekday-avg"
                       :class="cell.avg !== null ? surplusClass(cell.avg) : 'muted'"
                       x-text="cell.text"></div>
                  <div class="weekday-times metric" x-text="cell.times"></div>
                </div>
              </template>
            </div>
          </template>
          <template x-if="!weekdayPattern()">
            <p class="muted">No work days in this range.</p>
          </template>
        </section>
        <section class="an-panel" aria-labelledby="an-hist-h">
          <h2 id="an-hist-h">Daily surplus</h2>
          <template x-if="anHistogram()">
            <div class="an-hist-box">
              <div class="an-hist" role="img" :aria-label="anHistogram().caption" :title="anHistogram().caption">
                <template x-for="b in anHistogram().buckets" :key="b.lo">
                  <i :class="b.lo >= 0 ? 'up' : 'down'" :style="'height:' + b.pct + '%'" :title="b.title"></i>
                </template>
              </div>
              <div class="an-hist-x metric"><span>−3h</span><span>−2h</span><span>−1h</span><span>0</span><span>+1h</span><span>+2h</span><span>+3h</span></div>
            </div>
          </template>
          <template x-if="!anHistogram()">
            <p class="muted">No work days in this range.</p>
          </template>
        </section>
      </div>
    </div>
    <aside class="an-ledger" aria-label="Range">
      <h3>Range</h3>
      <div class="an-presets" role="radiogroup" aria-label="Range presets">
        <template x-for="p in AN_PRESETS" :key="p.id">
          <button type="button" role="radio" :aria-checked="an.preset === p.id ? 'true' : 'false'" :class="an.preset === p.id ? 'on' : ''" @click="anPreset(p.id)" x-text="p.label"></button>
        </template>
      </div>
      <template x-if="anSummary()">
        <div class="an-ledger-rows">
          <div class="an-lrow an-lrow--big"><span>Balance</span><b class="metric" :class="surplusClass(anSummary().surplus)" x-text="formatSurplus(anSummary().surplus)"></b></div>
          <div class="an-lrow"><span>Net worked</span><b class="metric" x-text="fmtPlain(anSummary().net) + 'h'"></b></div>
          <div class="an-lrow"><span>Target</span><b class="metric" x-text="fmtPlain(anSummary().target) + 'h'"></b></div>
          <div class="an-lrow"><span>Per work day</span><b class="metric" :class="surplusClass(anSummary().perDay)" x-text="anSummary().workDays ? formatSurplus(anSummary().perDay) : '—'"></b></div>
          <div class="an-lrow"><span>Work days</span><b class="metric" x-text="fmtDays(anSummary().workDays)"></b></div>
          <div class="an-lrow"><span>Off</span><b class="metric" x-text="fmtDays(anSummary().offDays)"></b></div>
          <div class="an-lrow"><span>Vacation · sick</span><b class="metric" x-text="fmtDays(anSummary().vacation) + ' · ' + fmtDays(anSummary().sick)"></b></div>
          <div class="an-lrow"><span>Logged days</span><b class="metric" x-text="anSummary().logged"></b></div>
        </div>
      </template>
      <template x-if="anFlSummary()">
        <div class="an-ledger-rows an-ledger-fl" data-testid="an-freelance">
          <h3><span class="fl-bolt" aria-hidden="true">⚡</span> Freelance</h3>
          <div class="an-lrow an-lrow--big"><span>Billed</span><b class="metric fl-money" x-text="fmtMoney(anFlSummary().eur)"></b></div>
          <template x-if="payouts.length > 0">
            <div class="an-lsplit">
              <div class="an-lrow an-paid" x-show="anFlSummary().paid > 0" data-testid="an-fl-paid"><span>Paid out</span><b class="metric" x-text="fmtMoney(anFlSummary().paid)"></b></div>
              <div class="an-lrow" x-show="anFlSummary().est > 0" data-testid="an-fl-est"><span>Estimated</span><b class="metric" x-text="fmtMoney(anFlSummary().est)"></b></div>
            </div>
          </template>
          <div class="an-lrow"><span>Hours</span><b class="metric" x-text="fmtHours(anFlSummary().hours)"></b></div>
          <div class="an-lrow"><span>Blocks</span><b class="metric" x-text="anFlSummary().blocks"></b></div>
          <div class="an-lrow"><span>€ / h gross</span><b class="metric" x-text="anFlSummary().hours ? fmtMoney(anFlSummary().rate) : '—'"></b></div>
          <div class="an-lrow" :title="'At ' + anFlSummary().year + '\'s projected tax picture'"><span>€ / h after tax</span><b class="metric" x-text="anFlSummary().netRate !== null ? '≈ ' + fmtMoney(anFlSummary().netRate) : '—'"></b></div>
        </div>
      </template>
    </aside>
  </div>

  <div class="section-header an-head">
    <h2>Years</h2>
  </div>
  <template x-if="yearly.length === 0">
    <p class="muted">No years yet.</p>
  </template>
  <div class="table-wrap" x-show="yearly.length" tabindex="0" role="region" aria-label="Years">
    <table class="an-years">
      <thead>
        <tr>
          <th>Year</th>
          <th class="num">Net</th>
          <th class="num">Target</th>
          <th class="num">Δ</th>
          <th class="num" title="Accumulated surplus carried in from all prior years">Carry-in</th>
          <th class="num">Work days</th>
          <th class="num">Off days</th>
        </tr>
      </thead>
      <tbody>
        <template x-for="row in yearlyWithCarryover()" :key="row.year">
          <tr>
            <td class="metric" x-text="row.label"></td>
            <td class="num metric" x-text="fmtPlain(row.net_hours) + 'h'"></td>
            <td class="num metric" x-text="fmtPlain(row.target_hours) + 'h'"></td>
            <td class="num metric" :class="surplusClass(row.surplus_hours)"
                x-text="formatSurplus(row.surplus_hours)"></td>
            <td class="num metric" :class="surplusClass(row.carry_in)"
                x-text="row.carry_in !== 0 ? formatSurplus(row.carry_in) : '—'"></td>
            <td class="num metric" x-text="fmtPlain(row.work_days)"></td>
            <td class="num metric" x-text="fmtPlain(row.non_work_days)"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>

  <div class="section-header an-head" title="For the range shown">
    <h2>Records</h2>
  </div>
  <template x-if="anRecords().length">
    <div class="an-records">
      <template x-for="r in anRecords()" :key="r.label">
        <div class="an-rec">
          <span class="an-rec-label" x-text="r.label"></span>
          <span><b class="metric" :class="r.cls || ''" x-text="r.value"></b><span class="an-rec-when metric" x-text="r.when"></span></span>
        </div>
      </template>
    </div>
  </template>
  <template x-if="!anRecords().length">
    <p class="muted">No records yet.</p>
  </template>
</section>
</template>
