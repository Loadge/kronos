<!-- ========================= LOG ========================= -->
<template x-if="tab==='log'">
<section aria-label="Log entry">
  <header class="page-head">
    <div class="page-head-title">
      <h2>Log</h2>
    </div>
    <div class="page-head-controls log-header-controls">
      <template x-if="hasFreelance()">
        <button type="button" class="fl-jump" @click="flJump()" :title="'Freelance blocks of ' + flDayLabel()"
                x-text="'⚡ ' + (flDayTotal() ? flTotalLabel(flDayTotal()) : 'add freelance')"></button>
      </template>
      <nav class="year-step" aria-label="Log year">
        <button type="button" @click="calSetYear(calYear - 1)" aria-label="Previous year">‹</button>
        <span class="year-step-v" x-text="calYear"></span>
        <button type="button" @click="calSetYear(calYear + 1)" aria-label="Next year">›</button>
      </nav>
    </div>
  </header>

  <!-- The year as twelve mini months (the planner's strip): a click makes that month the one
       on the calendar below; the lit one is the calendar's title. -->
  <div class="plan-strip log-strip" role="tablist" aria-label="Months">
    <template x-for="m in yearStrip(calYear, calMonth)" :key="m.mo">
      <button type="button" class="plan-mini" :class="m.active ? 'active' : ''"
              role="tab" :aria-selected="m.active ? 'true' : 'false'"
              @click="calMonth = m.mo" :aria-label="m.label + ' ' + calYear">
        <span class="plan-mini-title" x-text="m.label"></span>
        <span class="plan-mini-grid">
          <template x-for="c in m.cells" :key="c.key">
            <i :class="c.pad ? 'pad' : 'hm-cell ' + c.cls" :style="c.style"></i>
          </template>
        </span>
      </button>
    </template>
  </div>

  <div class="log-layout">

    <!-- ── Col 1: sticky calendar + bulk trigger ────────────────── -->
    <div class="log-col-left">
      <div class="log-cal" :aria-label="calMonthLabel()">
        <div class="log-cal-grid has-wk">
          <div class="log-cal-dow">Wk</div>
          <template x-for="h in ['Mo','Tu','We','Th','Fr','Sa','Su']" :key="h">
            <div class="log-cal-dow" x-text="h"></div>
          </template>
          <!-- one row per week: its ISO number (a button that opens the week in Days), then the 7 days -->
          <template x-for="row in calWeeks()" :key="row.key">
            <div class="log-cal-row">
              <button type="button" class="log-cal-wk"
                      :class="[row.isCurrent ? 'cur' : '', row.isSelected ? 'sel' : '']"
                      @click="calOpenWeek(row.monday)"
                      :disabled="!row.has"
                      x-text="row.no"
                      :aria-label="row.label"
                      :title="row.title">
              </button>
              <template x-for="cell in row.cells" :key="cell.key">
                <button type="button"
                        class="log-cal-day"
                        :class="[cell.cls, cell.isToday ? 'cal-today' : '', cell.isSelected ? 'cal-selected' : '', cell.padded ? 'log-cal-pad' : '', cell.fl ? 'has-fl' : '']"
                        :style="cell.style"
                        @click="calSelectDay(cell.date)"
                        :disabled="cell.padded"
                        x-text="cell.padded ? '' : cell.day"
                        :aria-label="cell.padded ? null : cell.date"
                        :aria-pressed="cell.isSelected ? 'true' : 'false'">
                </button>
              </template>
            </div>
          </template>
        </div>
        <div class="heatmap-legend log-cal-legend">
          <span class="legend-item"><span class="hm-swatch hm-surplus"></span> Surplus</span>
          <span class="legend-item"><span class="hm-swatch hm-deficit"></span> Deficit</span>
          <span class="legend-item"><span class="hm-swatch hm-neutral"></span> On target</span>
          <span class="legend-item"><span class="hm-swatch hm-vacation"></span> Vacation</span>
          <span class="legend-item"><span class="hm-swatch hm-sick"></span> Sick</span>
          <span class="legend-item"><span class="hm-swatch hm-holiday"></span> Holiday</span>
          <span class="legend-item"><span class="hm-swatch hm-flex"></span> Flex</span>
          <span class="legend-item"><span class="hm-swatch hm-partial-swatch"></span> Partial</span>
          <span class="legend-item"><span class="hm-swatch hm-ghost hm-ghost-vacation"></span> Planned</span>
          <span class="legend-item"><span class="hm-swatch hm-empty"></span> No entry</span>
          <template x-if="hasFreelance()"><span class="legend-item"><span class="hm-swatch hm-empty has-fl"></span> Freelance</span></template>
        </div>
      </div>
      <div class="bulk-trigger">
        <button type="button" class="secondary outline" @click="openBulkModal()" @touchend.prevent="openBulkModal()">Log multiple days…</button>
      </div>
    </div>

    <!-- ── Card surface: form (col 2) + the day's result rail (col 3, wide screens) ── -->
    <div class="log-form-card">
      <div class="card-title">
        <h3><span aria-hidden="true">👔</span> Employee</h3>
      </div>
      <form class="log-form-grid" @submit.prevent="saveEntry()">

        <!-- ── Form column ─────────────────────────────────────── -->
        <div class="log-col-center">

          <!-- Templates: collapsed ghost trigger → dropdown -->
          <template x-if="templates.length > 0">
            <div class="log-template-wrap" x-data="{ tplOpen: false }">
              <button type="button" class="template-trigger"
                      @click="tplOpen = !tplOpen"
                      :aria-expanded="tplOpen">
                <span>Templates</span>
                <span x-text="tplOpen ? '▴' : '▾'" class="muted" style="font-size:0.7rem"></span>
              </button>
              <div class="template-dropdown" x-show="tplOpen" @click.outside="tplOpen = false" x-transition>
                <template x-for="t in templates" :key="t.id">
                  <button type="button" class="template-pill" @click="applyTemplate(t); tplOpen = false">
                    <span x-text="t.name"></span>
                    <span class="muted template-times" x-text="t.start_time + '–' + t.end_time"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>

          <!-- Day type -->
          <label class="log-form-group">
            <span class="label-with-action">
              Day type
              <span class="day-pill day-pill-preview" :class="form.day_type" x-text="form.day_type"></span>
            </span>
            <select x-model="form.day_type" @change="onDayTypeChange()">
              <option value="work">Work</option>
              <option value="vacation">Vacation</option>
              <option value="sick">Sick</option>
              <option value="holiday">Holiday</option>
              <option value="flex">Flex</option>
            </select>
          </label>

          <!-- How much of the day is leave. Slider in hours (quarter-hour
               steps) up to the target in force on the selected date; at the top it's a
               whole day, anywhere below the time fields appear for the hours worked. -->
          <template x-if="form.day_type !== 'work'">
            <div class="leave-slider" data-testid="leave-slider">
              <div class="leave-slider-header">
                <span>Time off</span>
                <span class="leave-slider-value" :class="formIsPartial() ? 'partial' : ''"
                      x-text="leaveSliderLabel()"></span>
              </div>
              <input type="range" min="0.25" :max="leaveSliderMax()" step="0.25"
                     x-model.number="form.leave_hours"
                     aria-label="Hours of leave">
              <small class="muted" x-show="formIsPartial()">
                <template x-if="form.day_type === 'flex'">
                  <span>Flex still charges the whole day's target; log the hours you worked to offset it.</span>
                </template>
                <template x-if="form.day_type !== 'flex'">
                  <span>The rest of the day counts as work — log the hours below (optional).</span>
                </template>
              </small>
            </div>
          </template>

          <template x-if="formHasTimes()">
            <div class="log-times">
              <hr class="log-section-divider">

              <!-- Start / End time — Now pill lives in the label row -->
              <div class="grid">
                <label>
                  <div class="time-field-header">
                    <span>Start time</span>
                    <button type="button" class="now-pill"
                            x-show="form.date === todayIso()"
                            @click="stampNow('start_time')"
                            :title="'Stamp current time: ' + nowDisplay"
                            x-text="'⏱ ' + nowDisplay"></button>
                  </div>
                  <input type="time" x-model="form.start_time" :required="form.day_type === 'work'">
                </label>
                <label>
                  <div class="time-field-header">
                    <span>End time</span>
                    <button type="button" class="now-pill"
                            x-show="form.date === todayIso()"
                            @click="stampNow('end_time')"
                            :title="'Stamp current time: ' + nowDisplay"
                            x-text="'⏱ ' + nowDisplay"></button>
                  </div>
                  <input type="time" x-model="form.end_time">
                </label>
              </div>

              <fieldset>
                <legend>Breaks</legend>
                <template x-for="(b, i) in form.breaks" :key="i">
                  <div class="break-row">
                    <div class="break-input-line">
                      <input type="time" x-model="b.start_time"
                             @change="b.start_time && b.end_time && (b.break_minutes = rangeMinutes(b.start_time, b.end_time))"
                             :aria-label="'Break ' + (i+1) + ' start'">
                      <span class="muted break-sep">→</span>
                      <input type="time" x-model="b.end_time"
                             @change="b.start_time && b.end_time && (b.break_minutes = rangeMinutes(b.start_time, b.end_time))"
                             :aria-label="'Break ' + (i+1) + ' end'">
                      <span class="muted break-sep">or</span>
                      <input type="number" x-model.number="b.break_minutes" min="1" max="720"
                             @input="b.start_time = ''; b.end_time = ''"
                             :aria-label="'Break ' + (i+1) + ' minutes'">
                      <span class="muted break-minutes-label" x-text="minutesToLabel(b.break_minutes)"></span>
                      <button type="button" class="contrast outline compact"
                              @click="removeBreak(i)" title="Remove break">−</button>
                    </div>
                  </div>
                </template>
                <button type="button" class="secondary outline" @click="addBreak()">+ Add break</button>
              </fieldset>
            </div>
          </template>

          <!-- Notes: optional, one button that opens one textarea in place (like "+ Add break").
               The textarea is always in the DOM and only shown with x-show; a day that has
               notes is always open. -->
          <div class="log-notes">
            <button type="button" class="secondary outline"
                    x-show="!notesShown()" @click="openNotes()">+ Add note</button>
            <div class="log-notes-block" x-show="notesShown()">
              <div class="log-notes-inner">
                <div class="notes-header">
                  <span class="notes-label-text">Notes</span>
                  <span class="char-count" x-text="(form.notes || '').length + ' chars'"></span>
                </div>
                <textarea x-model="form.notes" x-ref="notes" rows="2" aria-label="Notes"
                          placeholder="anything worth remembering about this day"
                          @input="notesOpen = true; autosizeNotes($el)"
                          @blur="closeNotesIfEmpty($event)"
                          @keydown.escape="closeNotesIfEmpty()"></textarea>
              </div>
            </div>
          </div>

          <!-- Save as template — collapsible, only for new work entries -->
          <template x-if="form.day_type === 'work' && !editingDate">
            <details class="save-template-section">
              <summary>Save as template</summary>
              <div class="save-template-body">
                <input type="text" x-model="_tplName" placeholder="Template name"
                       class="template-name-input"
                       @keydown.enter.prevent="if (_tplName.trim()) { saveCurrentAsTemplate(_tplName); _tplName = ''; showToast('Template saved', 'neutral'); }">
                <button type="button" class="secondary outline compact"
                        :disabled="!_tplName.trim()"
                        @click="saveCurrentAsTemplate(_tplName); _tplName = ''; showToast('Template saved', 'neutral')">
                  Save
                </button>
              </div>
            </details>
          </template>

        </div><!-- /log-col-center -->

        <!-- ── Rail: the day's result and the primary action. Beside the form from
             1100px (sticky), a plain block after it below. ──────────────────────── -->
        <div class="log-col-rail">
          <!-- Impact preview -->
          <div class="impact-card" x-show="logPreview()" x-transition.duration.200ms>
            <div class="impact-cell">
              <span class="impact-label">Net</span>
              <span class="impact-value" x-text="(logPreview()?.net_hours ?? '') + 'h'"></span>
            </div>
            <div class="impact-cell">
              <span class="impact-label">Target</span>
              <span class="impact-value" x-text="(logPreview()?.target_hours ?? '') + 'h'"></span>
            </div>
            <div class="impact-cell">
              <span class="impact-label">Δ</span>
              <span class="impact-value impact-delta"
                    :class="surplusClass(logPreview()?.surplus_hours)"
                    x-effect="pulse($el, logPreview()?.surplus_hours)"
                    x-text="formatSurplus(logPreview()?.surplus_hours)"></span>
            </div>
            <div class="impact-bar" aria-hidden="true">
              <div class="impact-fill" :class="(logPreview()?.surplus_hours ?? 0) > 0.01 ? 'is-over' : ''"
                   :style="'width:' + impactPct() + '%'"></div>
            </div>
          </div>

          <!-- Primary CTA -->
          <div class="form-footer">
            <button type="submit" class="btn-action btn-action--block"
                    x-text="editingDate ? 'Save changes' : 'Create entry'"></button>
            <template x-if="editingDate">
              <button type="button" class="contrast outline"
                      @click="deleteEntry(editingDate)">Delete</button>
            </template>
          </div>
        </div><!-- /log-col-rail -->

      </form>
    </div><!-- /log-form-card -->

    <!-- ── Freelance blocks of the selected day ─────────────────────────────
         Independent of the employee entry above: saved on their own, the moment you add
         them, so a day that already has its hours takes a block in two taps. Only once an
         income source exists (Settings → Freelance). -->
    <template x-if="hasFreelance()">
      <div class="fl-card" data-testid="freelance-panel" :class="flForm.id ? 'fl-card--editing' : ''">
        <div class="card-title fl-head">
          <h3><span class="fl-bolt" aria-hidden="true">⚡</span> Freelance</h3>
          <template x-if="flDayTotal()">
            <span class="fl-total metric" :key="flDayTotal().hours + '-' + flDayTotal().eur">
              <span x-text="fmtHours(flDayTotal().hours)"></span> · <b x-text="flDayTotal().eur > 0 || !flDayTotal().missing ? fmtMoney(flDayTotal().eur) : 'no rate yet'"></b>
              <template x-if="flDayTotal().missing && flDayTotal().eur > 0"><span class="muted" x-text="' · ' + flDayTotal().missing + ' without a rate'"></span></template>
            </span>
          </template>
        </div>

        <!-- the week's payouts, read-only; they are typed in Days > Freelance -->
        <template x-for="p in flDayPayouts()" :key="p.id">
          <div class="fl-payout" data-testid="fl-payout-line" :style="'--src:' + sourceColor(p.source_id)">
            <span class="fl-dot" aria-hidden="true"></span>
            <span class="fl-payout-txt"><b class="metric" x-text="weekId(p.week_start)"></b> payout <b class="metric fl-money" x-text="payAmountLabel(p)"></b> <span class="muted" x-text="sourceById(p.source_id)?.name || ''"></span></span>
            <button type="button" class="fl-payout-pill" data-testid="fl-payout-pill" @click="openWeekInDays(p)" :aria-label="'Open ' + weekId(p.week_start) + ' in Days'">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5.5 1.5v3M10.5 1.5v3"/></svg>
              <span x-text="weekId(p.week_start) + ' in Days'"></span>
            </button>
          </div>
        </template>

        <ul class="fl-list" x-show="flDayBlocks().length">
          <template x-for="b in flDayBlocks()" :key="b.id">
            <li class="fl-block" :data-id="b.id" :class="flForm.id === b.id ? 'is-editing' : ''" :style="'--src:' + sourceColor(b.source_id)">
              <span class="fl-dot" aria-hidden="true"></span>
              <span class="fl-src" x-text="b.source_name"></span>
              <span class="fl-dur metric">
                <b x-text="fmtHours(b.hours)"></b>
                <template x-if="b.start_time"><span class="muted" x-text="blockDuration(b)"></span></template>
              </span>
              <span class="fl-amt metric" :class="b.amount_eur === null ? 'deficit' : (b.payout_id != null ? 'fl-est' : '')" :title="b.payout_id != null ? 'estimate; the week\'s payout counts' : null" x-text="blockAmountLabel(b)"></span>
              <span class="fl-note muted" x-text="b.notes || ''"></span>
              <span class="fl-actions">
                <button type="button" class="fl-icon" @click="flEdit(b)" :aria-label="'Edit block ' + b.source_name" title="Edit">✎</button>
                <button type="button" class="fl-icon fl-icon--x" @click="flRemove(b)" :aria-label="'Remove block ' + b.source_name" title="Remove">✕</button>
              </span>
            </li>
          </template>
        </ul>

        <!-- the editor: add a block, or change the one picked above -->
        <form class="fl-editor" @submit.prevent="flSave()" aria-label="Freelance block">
          <div class="fl-editor-row">
            <label class="fl-field fl-field--src">
              <span class="fl-lbl">Source</span>
              <select x-model.number="flForm.source_id" aria-label="Income source">
                <template x-for="s in liveSources()" :key="s.id">
                  <option :value="s.id" x-text="s.name + ' · ' + fmtMoney(s.hourly_rate, s.currency) + '/h'"></option>
                </template>
                <template x-if="flForm.id && sourceById(flForm.source_id)?.archived">
                  <option :value="flForm.source_id" x-text="sourceById(flForm.source_id).name + ' (archived)'"></option>
                </template>
              </select>
            </label>

            <div class="fl-field fl-field--dur">
              <span class="fl-lbl">
                <button type="button" class="fl-by" :class="flForm.by === 'hours' ? 'on' : ''" @click="flForm.by = 'hours'">Hours</button>
                <span class="muted">·</span>
                <button type="button" class="fl-by" :class="flForm.by === 'times' ? 'on' : ''" @click="flForm.by = 'times'">Start – end</button>
              </span>
              <template x-if="flForm.by === 'hours'">
                <div class="fl-stepper">
                  <button type="button" class="fl-step" @click="flStep(-0.25)" aria-label="Quarter hour less">−</button>
                  <input type="number" x-model.number="flForm.hours" min="0.25" max="24" step="0.25" aria-label="Hours" class="fl-hours">
                  <button type="button" class="fl-step" @click="flStep(0.25)" aria-label="Quarter hour more">+</button>
                </div>
              </template>
              <template x-if="flForm.by === 'times'">
                <div class="fl-times">
                  <input type="time" x-model="flForm.start_time" aria-label="Block start">
                  <span class="muted">→</span>
                  <input type="time" x-model="flForm.end_time" aria-label="Block end">
                  <span class="metric muted fl-times-h" x-text="fmtHours(flFormHours())"></span>
                </div>
              </template>
            </div>

            <label class="fl-field fl-field--note">
              <span class="fl-lbl">Note</span>
              <input type="text" x-model="flForm.notes" placeholder="what for" maxlength="200" aria-label="Block note">
            </label>
          </div>

          <!-- editing an existing block: its own rate and, for USD, the exchange rate of its day -->
          <template x-if="flForm.id">
            <div class="fl-editor-row fl-editor-row--adv">
              <label class="fl-field">
                <span class="fl-lbl">Rate <span class="muted" x-text="'(' + (blocks.find(b => b.id === flForm.id)?.currency || '') + '/h, as saved)'"></span></span>
                <input type="number" x-model.number="flForm.rate" min="0.01" step="0.01" class="fl-num" aria-label="Rate">
              </label>
              <template x-if="(blocks.find(b => b.id === flForm.id)?.currency) === 'USD'">
                <label class="fl-field">
                  <span class="fl-lbl">$ per € that day <span class="muted">(ECB, or yours)</span></span>
                  <input type="number" x-model.number="flForm.fx_rate" min="0.0001" step="0.0001" class="fl-num" aria-label="Exchange rate" placeholder="no rate">
                </label>
              </template>
            </div>
          </template>

          <div class="fl-editor-foot">
            <span class="fl-preview metric" x-show="flFormPreview()">
              ≈ <b x-text="flFormPreview() ? fmtMoney(flFormPreview().amount, flFormPreview().currency) : ''"></b>
              <span class="muted" x-text="flFormPreview() ? 'at ' + fmtMoney(flFormPreview().rate, flFormPreview().currency) + '/h' : ''"></span>
            </span>
            <span class="fl-editor-btns">
              <template x-if="flForm.id">
                <button type="button" class="secondary outline compact" @click="flCancelEdit()">Cancel</button>
              </template>
              <button type="submit" class="btn-action fl-submit" :disabled="!flFormValid() || flBusy" x-text="flForm.id ? 'Save block' : '+ Add block'"></button>
            </span>
            <template x-if="flFloat">
              <span class="fl-float metric" :key="flFloat.key" x-text="flFloat.text" aria-hidden="true"></span>
            </template>
          </div>
        </form>
      </div>
    </template>

  </div><!-- /log-layout -->

  <!-- Bulk log modal -->
  <template x-if="bulkModal.open">
    <div class="bulk-backdrop"
         @click.self="closeBulkModal()"
         @mouseup.window="bulkMouseup()"
         role="dialog"
         aria-modal="true"
         aria-label="Log multiple days">
      <div class="bulk-modal">
        <div class="bulk-modal-header">
          <h3>Log multiple days</h3>
          <button type="button" class="bulk-close" @click="closeBulkModal()" aria-label="Close">✕</button>
        </div>
        <div class="log-cal">
          <div class="log-cal-header">
            <button type="button" class="log-cal-nav" @click="bulkCalPrev()" aria-label="Previous month">‹</button>
            <span class="log-cal-title" x-text="bulkCalLabel()"></span>
            <button type="button" class="log-cal-nav" @click="bulkCalNext()" aria-label="Next month">›</button>
          </div>
          <div class="log-cal-grid" @mousemove="bulkGridMove($event)">
            <template x-for="h in ['Mo','Tu','We','Th','Fr','Sa','Su']" :key="h">
              <div class="log-cal-dow" x-text="h"></div>
            </template>
            <template x-for="cell in bulkCalDays()" :key="cell.key">
              <button type="button"
                      class="log-cal-day"
                      :class="[cell.cls, cell.padded ? 'log-cal-pad' : '', cell.isToday ? 'cal-today' : '', bulkIsHighlighted(cell.date) ? 'bulk-selected' : '', cell.weekend ? 'bulk-weekend' : '']"
                      :style="cell.style"
                      @mousedown.prevent="bulkMousedown($event, cell.date)"
                      :data-bdate="cell.padded ? null : cell.date"
                      :disabled="cell.padded"
                      x-text="cell.padded ? '' : cell.day"
                      :aria-label="cell.padded ? null : cell.date"
                      :aria-pressed="bulkIsHighlighted(cell.date) ? 'true' : 'false'">
              </button>
            </template>
          </div>
          <p class="muted bulk-hint">Click to select · Click+drag to select a range</p>
        </div>
        <div class="bulk-pill">
          <span class="bulk-pill-count muted"
                x-text="bulkModal.selected.length + ' day' + (bulkModal.selected.length !== 1 ? 's' : '') + ' selected'"></span>
          <div class="bulk-pill-actions">
            <button type="button" class="bulk-pill-btn vacation" @click="bulkSubmit('vacation')" :disabled="!bulkModal.selected.length || bulkModal.submitting">Vacation</button>
            <button type="button" class="bulk-pill-btn sick"     @click="bulkSubmit('sick')"     :disabled="!bulkModal.selected.length || bulkModal.submitting">Sick</button>
