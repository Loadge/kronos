<!-- ========================= DAYS ========================= -->
<template x-if="tab==='days'">
<section aria-label="All logged days" x-init="$nextTick(() => scrollToToday())">
  <header class="section-header days-header">
    <h2>Days</h2>
    <div class="section-header-controls">
      <select x-model="daysYear" aria-label="Year" class="days-year">
        <option value="all">All years</option>
        <template x-for="y in yearsWithData()" :key="y">
          <option :value="y" x-text="y"></option>
        </template>
      </select>
      <div class="notes-search-wrap">
        <input type="search" class="notes-search" placeholder="Search notes…"
               x-model="notesQuery" aria-label="Filter entries by notes">
        <template x-if="notesQuery.trim()">
          <button type="button" class="notes-search-clear" @click="notesQuery = ''" aria-label="Clear search">✕</button>
        </template>
      </div>
      <span class="muted days-count" x-text="sortedEntries().length + ' entries'"></span>
      <button type="button" class="secondary outline compact pdf-btn" @click="openPdfModal()" title="Printable timesheet">PDF</button>
    </div>
  </header>

  <!-- Timesheet picker: builds a /timesheet URL and opens it in a new tab -->
  <template x-if="pdfModal.open">
    <div class="bulk-backdrop" @click.self="pdfModal.open = false" role="dialog" aria-modal="true" aria-label="Printable timesheet">
      <div class="bulk-modal pdf-modal">
        <div class="bulk-modal-header">
          <h3>Timesheet</h3>
          <button type="button" class="bulk-close" @click="pdfModal.open = false" aria-label="Close">✕</button>
        </div>
        <form @submit.prevent="openTimesheet()">
          <fieldset class="pdf-presets">
            <legend>Period</legend>
            <template x-for="p in pdfPresets()" :key="p.id">
              <label class="pdf-preset">
                <input type="radio" name="pdf-period" :value="p.id" x-model="pdfModal.preset">
                <span x-text="p.label"></span>
                <small class="muted" x-text="p.hint"></small>
              </label>
            </template>
            <div class="pdf-custom" x-show="pdfModal.preset === 'custom'">
              <label>From <input type="date" x-model="pdfModal.from" :max="pdfModal.to || null" :required="pdfModal.preset === 'custom'"></label>
              <label>To <input type="date" x-model="pdfModal.to" :min="pdfModal.from || null" :required="pdfModal.preset === 'custom'"></label>
            </div>
          </fieldset>
          <div class="pdf-options">
            <div class="pdf-opt">
              <span class="pdf-opt-label">Detail</span>
              <div class="seg-toggle" role="radiogroup" aria-label="Detail">
                <button type="button" role="radio" :aria-checked="pdfModal.detail === 'compact' ? 'true' : 'false'" :class="pdfModal.detail === 'compact' ? 'on' : ''" @click="pdfModal.detail = 'compact'">Compact</button>
                <button type="button" role="radio" :aria-checked="pdfModal.detail === 'full' ? 'true' : 'false'" :class="pdfModal.detail === 'full' ? 'on' : ''" @click="pdfModal.detail = 'full'">Full</button>
              </div>
            </div>
            <div class="pdf-opt">
              <span class="pdf-opt-label">Hours</span>
              <div class="seg-toggle" role="radiogroup" aria-label="Hours format">
                <button type="button" role="radio" :aria-checked="pdfModal.hours === 'dec' ? 'true' : 'false'" :class="pdfModal.hours === 'dec' ? 'on' : ''" @click="pdfModal.hours = 'dec'">7.50</button>
                <button type="button" role="radio" :aria-checked="pdfModal.hours === 'hm' ? 'true' : 'false'" :class="pdfModal.hours === 'hm' ? 'on' : ''" @click="pdfModal.hours = 'hm'">7:30</button>
              </div>
            </div>
            <div class="pdf-opt">
              <span class="pdf-opt-label">Theme</span>
              <div class="seg-toggle" role="radiogroup" aria-label="Theme">
                <button type="button" role="radio" :aria-checked="pdfModal.theme === 'light' ? 'true' : 'false'" :class="pdfModal.theme === 'light' ? 'on' : ''" @click="pdfModal.theme = 'light'">Light</button>
                <button type="button" role="radio" :aria-checked="pdfModal.theme === 'dark' ? 'true' : 'false'" :class="pdfModal.theme === 'dark' ? 'on' : ''" @click="pdfModal.theme = 'dark'">Dark</button>
              </div>
            </div>
            <div class="pdf-checks">
              <label class="pdf-check"><input type="checkbox" x-model="pdfModal.notes"> Notes column</label>
              <label class="pdf-check"><input type="checkbox" x-model="pdfModal.sign"> Signature lines</label>
            </div>
          </div>
          <p class="muted pdf-hint">Opens in a new tab. Use the browser's <strong>Print → Save as PDF</strong> there; the switches can still be changed on the page.
            <template x-if="!settingsForm.profile_name"><span>Add your name under <a @click.prevent="pdfModal.open = false; go('settings')">Settings → Profile</a> to print it in the header.</span></template>
          </p>
          <div class="pdf-actions">
            <button type="submit" class="log-submit-btn">Open timesheet</button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- skeleton while the first fetch is in flight -->
  <template x-if="loading.days && !entries.length">
    <div class="table-wrap" aria-hidden="true">
      <table class="days-table">
        <thead>
          <tr>
            <th>Date</th><th></th><th>Type</th><th>Start</th><th>End</th>
            <th>Breaks</th><th>Net</th><th>Target</th><th>Δ</th><th>Σ</th><th>Notes</th><th></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="i in [1,2,3,4,5]" :key="i">
            <tr class="skel-row">
              <td><div class="skel-line"></div></td>
              <td></td>
              <td><div class="skel-pill"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line"></div></td>
              <td></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>

  <!-- empty state: only shown once loading is done -->
  <template x-if="!loading.days && !entries.length">
    <p class="muted">No entries yet. <a @click.prevent="go('log')">Log your first day</a>.</p>
  </template>

  <!-- Dense table: the whole row opens the day in Log (✎ is the focusable target), notes are
       always visible in the last column, a separator with its subtotal opens every month while
       sorted by date. One <tbody> per row keeps the `day-row-<date>` anchor for scrollToToday. -->
  <template x-if="entries.length">
    <div class="table-wrap days-wrap">
      <table class="days-table">
        <thead>
          <tr>
            <th @click="sortBy('date')" class="sortable" role="columnheader" tabindex="0"
                :aria-sort="sortKey==='date' ? (sortDir==='asc' ? 'ascending' : 'descending') : 'none'"
                @keydown.enter.prevent="sortBy('date')" @keydown.space.prevent="sortBy('date')">Date</th>
            <th></th>
            <th>Type</th>
            <th class="num">Start</th>
            <th class="num">End</th>
            <th class="num">Breaks</th>
            <th @click="sortBy('net_hours')" class="sortable num" role="columnheader" tabindex="0"
                :aria-sort="sortKey==='net_hours' ? (sortDir==='asc' ? 'ascending' : 'descending') : 'none'"
                @keydown.enter.prevent="sortBy('net_hours')" @keydown.space.prevent="sortBy('net_hours')">Net</th>
            <th class="num">Target</th>
            <th class="num">Δ</th>
            <th class="num" title="Running cumulative surplus from the start of the period">Σ</th>
            <th class="notes-col">Notes</th>
            <th class="act-col"><span class="visually-hidden">Edit</span></th>
          </tr>
        </thead>
        <template x-for="r in daysRows()" :key="r.key">
          <tbody :id="r.kind === 'entry' ? 'day-row-' + r.e.date : null"
                 :class="{ 'today-row': r.kind === 'entry' && r.e._isAnchor }">
            <template x-if="r.kind === 'sep'">
              <tr class="month-sep">
                <td colspan="12">
                  <span class="month-sep-name" x-text="r.label"></span>
                  <span class="month-sep-sum metric">
                    <span x-text="r.count + (r.count === 1 ? ' day' : ' days')"></span> ·
                    <b x-text="r.net + 'h'"></b> / <span x-text="r.target + 'h'"></span> ·
                    <b :class="surplusClass(r.surplus)" x-text="formatSurplus(r.surplus)"></b>
                  </span>
                </td>
              </tr>
            </template>
            <template x-if="r.kind === 'entry'">
              <tr class="day-row" :class="[r.e.day_type !== 'work' ? 'non-work' : '', r.e._saving ? 'row-saving' : '']"
                  @click="editEntry(r.e)" :title="'Edit ' + r.e.date">
                <td class="metric" x-text="r.e.date"></td>
                <td class="dow" x-text="r.e._dow"></td>
                <td><span class="day-pill" :class="r.e.day_type" x-text="pillLabel(r.e)"></span></td>
                <td class="num metric" x-text="r.e.start_time || '—'"></td>
                <td class="num metric" x-text="r.e.end_time || '—'"></td>
                <td class="num metric" x-text="r.e.total_break_minutes ? r.e.total_break_minutes + 'm' : '—'"></td>
                <td class="num metric" x-text="r.e.net_hours + 'h'"></td>
                <td class="num metric" x-text="r.e.target_hours + 'h'"></td>
                <td class="num metric" :class="surplusClass(r.e.surplus_hours)" x-text="formatSurplus(r.e.surplus_hours)"></td>
                <td class="num metric" :class="surplusClass(r.e._cumulative)" x-text="formatSurplus(r.e._cumulative)"></td>
                <td class="notes-col" x-html="r.e.notes ? highlightNotes(r.e.notes, notesQuery) : ''"></td>
                <td class="act-col" @click.stop>
                  <template x-if="!r.e._saving">
                    <button type="button" class="row-edit" @click="editEntry(r.e)" aria-label="Edit" :title="'Edit ' + r.e.date">✎</button>
                  </template>
                  <template x-if="r.e._saving">
                    <span class="saving-indicator" aria-label="Saving…">⏳</span>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </template>
      </table>
    </div>
  </template>
</section>
</template>
