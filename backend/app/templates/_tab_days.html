<!-- ========================= DAYS ========================= -->
<template x-if="tab==='days'">
<section aria-label="All logged days" x-init="$nextTick(() => scrollToToday())">
  <header class="page-head days-header">
    <div class="page-head-title"><h2>Days</h2></div>
    <div class="page-head-controls">
      <div class="notes-search-wrap">
        <input type="search" class="notes-search" placeholder="Search notes…"
               x-model="notesQuery" aria-label="Filter entries by notes">
        <template x-if="notesQuery.trim()">
          <button type="button" class="notes-search-clear" @click="notesQuery = ''" aria-label="Clear search">✕</button>
        </template>
      </div>
      <button type="button" class="head-btn pdf-btn" @click="openPdfModal()" :title="daysMode === 'freelance' ? 'Printable freelance timesheet' : 'Printable timesheet'" x-text="daysMode === 'freelance' ? '⚡ PDF' : 'PDF'"></button>
      <!-- the year, or every year -->
      <button type="button" class="year-all" :class="daysYear === 'all' ? 'on' : ''" @click="daysToggleAll()" :aria-pressed="daysYear === 'all' ? 'true' : 'false'" title="Every year">All</button>
      <nav class="year-step" :class="daysYear === 'all' ? 'is-off' : ''" aria-label="Days year">
        <button type="button" @click="daysStepYear(-1)" aria-label="Previous year">‹</button>
        <span class="year-step-v" x-text="daysYear === 'all' ? daysLastYear : daysYear"></span>
        <button type="button" @click="daysStepYear(1)" aria-label="Next year">›</button>
      </nav>
    </div>
  </header>

  <!-- 👔 Employee · ⚡ Freelance — only once an income source exists. -->
  <template x-if="hasFreelance()">
    <div class="subtabs" role="tablist" aria-label="Days of">
      <a role="tab" :aria-selected="daysMode === 'employee' ? 'true' : 'false'" :class="daysMode === 'employee' ? 'on' : ''" @click.prevent="setDaysMode('employee')"><span aria-hidden="true">👔</span> Employee</a>
      <a role="tab" :aria-selected="daysMode === 'freelance' ? 'true' : 'false'" :class="daysMode === 'freelance' ? 'on' : ''" @click.prevent="setDaysMode('freelance')"><span class="fl-bolt" aria-hidden="true">⚡</span> Freelance</a>
    </div>
  </template>

  <!-- Timesheet picker: builds a /timesheet URL and opens it in a new tab -->
  <template x-if="pdfModal.open">
    <div class="bulk-backdrop" @click.self="pdfModal.open = false" role="dialog" aria-modal="true" aria-label="Printable timesheet">
      <div class="bulk-modal pdf-modal">
        <div class="bulk-modal-header">
          <h3 x-text="pdfModal.kind === 'freelance' ? '⚡ Freelance timesheet' : 'Timesheet'"></h3>
          <button type="button" class="bulk-close" @click="pdfModal.open = false" aria-label="Close">✕</button>
        </div>
        <form @submit.prevent="openTimesheet()">
          <fieldset class="pdf-presets">
            <legend>Period</legend>
            <template x-for="p in pdfPresets()" :key="p.id">
              <label class="pdf-preset">
                <input type="radio" name="pdf-period" :value="p.id" x-model="pdfModal.preset">
                <span x-text="p.label"></span>
                <small class="muted" x-text="p.hint"></small>
              </label>
            </template>
            <div class="pdf-custom" x-show="pdfModal.preset === 'custom'">
              <label>From <input type="date" x-model="pdfModal.from" :max="pdfModal.to || null" :required="pdfModal.preset === 'custom'"></label>
              <label>To <input type="date" x-model="pdfModal.to" :min="pdfModal.from || null" :required="pdfModal.preset === 'custom'"></label>
            </div>
          </fieldset>
          <template x-if="pdfModal.kind === 'freelance'">
            <fieldset class="pdf-presets pdf-sources">
              <legend>Sources <small class="muted"><a @click.prevent="daysSourcesAll(true)">all</a> · <a @click.prevent="daysSourcesAll(false)">none</a></small></legend>
              <template x-for="s in sources" :key="s.id">
                <label class="pdf-check pdf-src" :style="'--src:' + sourceColor(s.id)">
                  <input type="checkbox" :checked="daysSources.includes(s.id)" @change="daysToggleSource(s.id)">
                  <span class="fl-dot" aria-hidden="true"></span>
                  <span x-text="s.name"></span>
                  <template x-if="s.archived"><small class="muted">archived</small></template>
                </label>
              </template>
            </fieldset>
          </template>
          <div class="pdf-options">
            <div class="pdf-opt" x-show="pdfModal.kind !== 'freelance'">
              <span class="pdf-opt-label">Detail</span>
              <div class="seg-toggle" role="radiogroup" aria-label="Detail">
                <button type="button" role="radio" :aria-checked="pdfModal.detail === 'compact' ? 'true' : 'false'" :class="pdfModal.detail === 'compact' ? 'on' : ''" @click="pdfModal.detail = 'compact'">Compact</button>
                <button type="button" role="radio" :aria-checked="pdfModal.detail === 'full' ? 'true' : 'false'" :class="pdfModal.detail === 'full' ? 'on' : ''" @click="pdfModal.detail = 'full'">Full</button>
              </div>
            </div>
            <div class="pdf-opt">
              <span class="pdf-opt-label">Hours</span>
              <div class="seg-toggle" role="radiogroup" aria-label="Hours format">
                <button type="button" role="radio" :aria-checked="pdfModal.hours === 'dec' ? 'true' : 'false'" :class="pdfModal.hours === 'dec' ? 'on' : ''" @click="pdfModal.hours = 'dec'">7.50</button>
                <button type="button" role="radio" :aria-checked="pdfModal.hours === 'hm' ? 'true' : 'false'" :class="pdfModal.hours === 'hm' ? 'on' : ''" @click="pdfModal.hours = 'hm'">7:30</button>
              </div>
            </div>
            <div class="pdf-opt">
              <span class="pdf-opt-label">Theme</span>
              <div class="seg-toggle" role="radiogroup" aria-label="Theme">
                <button type="button" role="radio" :aria-checked="pdfModal.theme === 'light' ? 'true' : 'false'" :class="pdfModal.theme === 'light' ? 'on' : ''" @click="pdfModal.theme = 'light'">Light</button>
                <button type="button" role="radio" :aria-checked="pdfModal.theme === 'dark' ? 'true' : 'false'" :class="pdfModal.theme === 'dark' ? 'on' : ''" @click="pdfModal.theme = 'dark'">Dark</button>
              </div>
            </div>
            <div class="pdf-checks">
              <label class="pdf-check"><input type="checkbox" x-model="pdfModal.notes"> Notes column</label>
              <label class="pdf-check"><input type="checkbox" x-model="pdfModal.sign"> Signature lines</label>
            </div>
          </div>
          <p class="muted pdf-hint">Opens in a new tab. Use the browser's <strong>Print → Save as PDF</strong> there; the switches can still be changed on the page.
            <template x-if="!settingsForm.profile_name"><span>Add your name under <a @click.prevent="pdfModal.open = false; go('settings')">Settings → Profile</a> to print it in the header.</span></template>
          </p>
          <div class="pdf-actions">
            <button type="submit" class="log-submit-btn" :disabled="pdfModal.kind === 'freelance' && !daysSources.length" x-text="pdfModal.kind === 'freelance' ? 'Open freelance timesheet' : 'Open timesheet'"></button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ── ⚡ Freelance: a filter bar (a row per source) and the blocks, one row each ── -->
  <template x-if="daysMode === 'freelance'">
    <div class="days-fl" data-testid="days-freelance">
      <div class="fbar">
        <div class="frows" aria-label="Sources">
          <div class="frow frow-head">
            <span></span><span></span>
            <span>Sources · <a @click.prevent="daysSourcesAll(true)">all</a> · <a @click.prevent="daysSourcesAll(false)">none</a></span>
            <span class="n">blocks</span><span class="n">hours</span><span class="n">€</span>
          </div>
          <template x-for="s in daysSourceRows()" :key="s.id">
            <label class="frow" :class="s.on ? '' : 'off'" :style="'--src:' + sourceColor(s.id)">
              <input type="checkbox" :checked="s.on" @change="daysToggleSource(s.id)" :aria-label="'Include ' + s.name">
              <span class="fl-dot" aria-hidden="true"></span>
              <span class="frow-name"><span x-text="s.name"></span><template x-if="s.archived"><span class="src-tag">archived</span></template></span>
              <span class="n metric" x-text="s.blocks"></span>
              <span class="n metric" x-text="fmtHours(s.hours)"></span>
              <span class="n metric" x-text="fmtMoney0(s.eur)"></span>
            </label>
          </template>
        </div>
        <div class="ftot" data-testid="days-fl-total">
          <span class="fl-lbl">selected</span>
          <b class="metric" x-text="fmtMoney(daysFlTotals().eur)"></b>
          <span class="metric muted" x-text="daysFlTotals().blocks + ' block' + (daysFlTotals().blocks !== 1 ? 's' : '') + ' · ' + fmtHours(daysFlTotals().hours) + (daysFlTotals().hours ? ' · ' + fmtMoney(daysFlTotals().rate) + '/h' : '')"></span>
          <template x-if="daysFlTotals().missing"><span class="deficit" style="font-size:0.76rem" x-text="daysFlTotals().missing + ' without a rate'"></span></template>
        </div>
      </div>
      <template x-if="!daysFlRows().length">
        <p class="muted" x-text="daysSources.length ? 'No freelance blocks here.' : 'No source selected.'"></p>
      </template>
      <template x-if="daysFlRows().length">
        <p class="wk-tools"><a @click.prevent="daysWeeksSetAll(true)" href="#" data-testid="wk-expand-all">Expand all</a> · <a @click.prevent="daysWeeksSetAll(false)" href="#" data-testid="wk-collapse-all">Collapse all</a></p>
      </template>
      <template x-if="daysFlRows().length">
        <div class="table-wrap days-wrap">
          <table class="days-table days-table--fl">
            <thead>
              <tr>
                <th>Date</th><th></th><th>Source</th>
                <th class="num">Start</th><th class="num">End</th><th class="num">Hours</th>
                <th class="num">Rate</th><th class="num">Amount</th><th class="num">€</th>
                <th class="notes-col">Note</th>
                <th class="act-col"><span class="visually-hidden">Edit</span></th>
              </tr>
            </thead>
            <template x-for="r in daysFlRows()" :key="r.key">
              <tbody>
                <template x-if="r.kind === 'sep'">
                  <tr class="month-sep">
                    <td colspan="11">
                      <span class="month-sep-name" x-text="r.label"></span>
                      <span class="month-sep-sum metric">
                        <span x-text="r.count + (r.count === 1 ? ' block' : ' blocks')"></span> ·
                        <b x-text="fmtHours(r.hours)"></b> · <b class="fl-money" x-text="fmtMoney(r.eur)"></b>
                        <template x-for="f in r.from" :key="f.id"><span class="muted" x-text="' · ' + fmtMoney0(f.eur) + ' of it from ' + f.id"></span></template>
                      </span>
                    </td>
                  </tr>
                </template>
                <template x-if="r.kind === 'week'">
                  <tr class="wk-row" :id="'wk-' + r.week" :class="[r.current ? 'cur' : '', r.open ? 'open' : '']" :data-week="r.id">
                    <td colspan="11">
                      <button type="button" class="wk-head" @click="daysWeekToggle(r.week)" :aria-expanded="r.open ? 'true' : 'false'" :aria-label="r.id + ' ' + r.range">
                        <span class="chev" aria-hidden="true">▸</span>
                        <b class="metric wk-id" x-text="r.id"></b>
                        <span class="wk-range" x-text="r.range"></span>
                        <template x-if="r.current"><span class="wk-now">this week</span></template>
                        <template x-if="r.splits"><span class="wk-split" x-text="r.splits"></span></template>
                        <span class="wk-hh metric" x-text="fmtHours(r.hours)"></span>
                        <span class="wk-mm metric fl-money" :class="r.tag === 'paid out' ? 'is-paid' : ''" x-text="fmtMoney0(r.eur)"></span>
                        <span class="wk-tag" :class="r.tag === 'estimated' ? 'est' : 'paid'" x-text="r.tag"></span>
                        <template x-if="r.awaiting"><span class="wk-await">awaiting payout</span></template>
                        <span class="wk-status" :class="payStatusCls(r.week)" x-text="payStatus(r.week)" aria-live="polite"></span>
                      </button>
                    </td>
                  </tr>
                </template>
                <template x-if="r.kind === 'week' && r.open">
                  <tr class="wk-lines" :class="r.blocks.length ? 'has-blocks' : ''">
                    <td colspan="11">
                      <div class="wk-cols" aria-hidden="true"><span>Source</span><span class="r">Hours</span><span class="r">Estimate</span><span>Payout</span><span class="r">Gap</span><span class="r">€ / h</span></div>
                      <template x-for="l in r.lines" :key="l.key">
                        <div class="wk-line" :class="l.payout ? 'has-pay' : ''" :style="'--src:' + sourceColor(l.source.id)" :data-source="l.source.name">
                          <span class="wk-src"><span class="fl-dot" aria-hidden="true"></span><span x-text="l.source.name"></span></span>
                          <span class="wk-h metric" data-l="Hours" x-text="l.hours > 0 ? fmtHours(l.hours) : '0h'"></span>
                          <span class="wk-est metric" data-l="Estimate" x-text="l.hours > 0 ? fmtMoney(l.estimate, l.currency, Number.isInteger(l.estimate) ? 0 : 2) : '—'"></span>
                          <span class="wk-pay" data-l="Payout">
                            <span class="cur metric" x-text="l.currency === 'USD' ? '$' : '€'"></span>
                            <input type="text" inputmode="decimal" class="payin metric" autocomplete="off"
                              :value="payText(l.source.id, r.week, l.payout)"
                              @input="payTyped(l.source.id, r.week, $event.target.value)"
                              :placeholder="l.payout ? '' : 'payout'"
                              :aria-label="'Payout ' + l.source.name + ' ' + r.id">
                            <template x-if="l.payout && l.currency === 'USD'">
                              <span class="wk-fx metric">
                                <template x-if="fxEditing !== l.payout.id">
                                  <span><span x-text="l.payout.fx_rate ? '@ ' + l.payout.fx_rate.toFixed(4) : 'no rate'"></span> <button type="button" class="pen" @click="fxEdit(l.payout)" :aria-label="'Edit the exchange rate of ' + l.source.name + ' ' + r.id" title="Edit the exchange rate">✎</button></span>
                                </template>
                                <template x-if="fxEditing === l.payout.id">
                                  <input type="text" inputmode="decimal" class="fxin metric" :value="l.payout.fx_rate || ''" x-init="$nextTick(() => $el.focus())"
                                    @keydown.enter.prevent="fxSave(l.payout, $event.target.value)" @keydown.escape="fxEditing = null" @blur="fxSave(l.payout, $event.target.value)"
                                    :aria-label="'Exchange rate USD per EUR, ' + l.source.name + ' ' + r.id">
                                </template>
                                <span class="wk-conv" x-text="l.payout.amount_eur === null ? '' : '= ' + fmtMoney0(l.payout.amount_eur)"></span>
                              </span>
                            </template>
                          </span>
                          <template x-if="l.gap !== null">
                            <span class="wk-gap metric" data-l="Gap" :class="l.gap >= 0 ? 'surplus' : 'deficit'"><b x-text="payGapLabel(l.gap, l.currency)"></b></span>
                          </template>
                          <template x-if="l.gap !== null">
                            <span class="wk-eph metric" data-l="€ / h" x-text="l.eph === null ? 'no rate' : fmtMoney(l.eph)"></span>
                          </template>
                          <template x-if="l.gap === null">
                            <span class="wk-gap wide quiet" x-text="l.noHours ? 'payout with no hours' : (l.payout ? '' : (r.awaiting ? 'awaiting payout' : ''))"></span>
                          </template>
                        </div>
                      </template>
                    </td>
                  </tr>
                </template>
                <template x-if="r.kind === 'block'">
                  <tr class="day-row blk" :class="r.last ? 'blk-last' : ''" @click="openBlockInLog(r.b)" :title="'Edit this block in Log'" :style="'--src:' + sourceColor(r.b.source_id)">
                    <td class="metric" x-text="r.b.date"></td>
                    <td class="dow" x-text="r.dow"></td>
                    <td><span class="fl-dot" aria-hidden="true"></span> <span x-text="r.b.source_name"></span></td>
                    <td class="num metric" x-text="r.b.start_time || '—'"></td>
                    <td class="num metric" x-text="r.b.end_time || '—'"></td>
                    <td class="num metric" x-text="fmtHours(r.b.hours)"></td>
                    <td class="num metric" x-text="fmtMoney(r.b.rate, r.b.currency)"></td>
                    <td class="num metric" x-text="fmtMoney(r.b.amount, r.b.currency)"></td>
                    <td class="num metric" :class="r.b.amount_eur === null ? 'deficit' : (r.b.payout_id != null ? 'fl-est' : 'fl-money')" :title="r.b.payout_id != null ? 'estimate; the week\'s payout counts' : null" x-text="r.b.amount_eur === null ? 'no rate' : fmtMoney(r.b.amount_eur)"></td>
                    <td class="notes-col" x-html="r.b.notes ? highlightNotes(r.b.notes, notesQuery) : ''"></td>
                    <td class="act-col" @click.stop>
                      <button type="button" class="row-edit" @click="openBlockInLog(r.b)" aria-label="Edit" title="Edit this block in Log">✎</button>
                    </td>
                  </tr>
                </template>
              </tbody>
            </template>
          </table>
        </div>
      </template>
    </div>
  </template>

  <template x-if="daysMode === 'employee'">
  <div>
  <!-- skeleton while the first fetch is in flight -->
  <template x-if="loading.days && !entries.length">
    <div class="table-wrap" aria-hidden="true">
      <table class="days-table">
        <thead>
          <tr>
            <th>Date</th><th></th><th>Type</th><th>Start</th><th>End</th>
            <th>Breaks</th><th>Net</th><th>Target</th><th>Δ</th><th>Σ</th><th>Notes</th><th></th>
          </tr>
        </thead>
        <tbody>
          <template x-for="i in [1,2,3,4,5]" :key="i">
            <tr class="skel-row">
              <td><div class="skel-line"></div></td>
              <td></td>
              <td><div class="skel-pill"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line skel-short"></div></td>
              <td><div class="skel-line"></div></td>
              <td></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </template>

  <!-- empty state: only shown once loading is done -->
  <template x-if="!loading.days && !entries.length">
    <p class="muted">No entries yet. <a @click.prevent="go('log')">Log your first day</a>.</p>
  </template>

  <!-- Dense table: the whole row opens the day in Log (✎ is the focusable target), notes are
       always visible in the last column, a separator with its subtotal opens every month while
       sorted by date. One <tbody> per row keeps the `day-row-<date>` anchor for scrollToToday. -->
  <template x-if="entries.length">
    <div class="table-wrap days-wrap">
      <table class="days-table">
        <thead>
          <tr>
            <th @click="sortBy('date')" class="sortable" role="columnheader" tabindex="0"
                :aria-sort="sortKey==='date' ? (sortDir==='asc' ? 'ascending' : 'descending') : 'none'"
                @keydown.enter.prevent="sortBy('date')" @keydown.space.prevent="sortBy('date')">Date</th>
            <th></th>
            <th>Type</th>
            <th class="num">Start</th>
            <th class="num">End</th>
            <th class="num">Breaks</th>
            <th @click="sortBy('net_hours')" class="sortable num" role="columnheader" tabindex="0"
                :aria-sort="sortKey==='net_hours' ? (sortDir==='asc' ? 'ascending' : 'descending') : 'none'"
                @keydown.enter.prevent="sortBy('net_hours')" @keydown.space.prevent="sortBy('net_hours')">Net</th>
            <th class="num">Target</th>
            <th class="num">Δ</th>
            <th class="num" title="Running cumulative surplus from the start of the period">Σ</th>
            <th class="notes-col">Notes</th>
            <th class="act-col"><span class="visually-hidden">Edit</span></th>
          </tr>
        </thead>
        <template x-for="r in daysRows()" :key="r.key">
          <tbody :id="r.kind === 'entry' ? 'day-row-' + r.e.date : (r.kind === 'wk' ? 'eweek-' + r.week : null)"
                 :class="{ 'today-row': r.kind === 'entry' && r.e._isAnchor, 'week-flash': !!r.week && r.week === daysFlashWeek }">
            <template x-if="r.kind === 'wk'">
              <tr class="week-sep">
                <td colspan="12">
                  <span class="week-sep-name" x-text="r.id"></span>
                  <span class="week-sep-range" x-text="r.range"></span>
                  <span class="week-sep-sum metric">
                    <span x-text="r.count + (r.count === 1 ? ' day' : ' days')"></span> ·
                    <b x-text="r.net + 'h'"></b> / <span x-text="r.target + 'h'"></span> ·
                    <b :class="surplusClass(r.surplus)" x-text="formatSurplus(r.surplus)"></b>
                  </span>
                </td>
              </tr>
            </template>
            <template x-if="r.kind === 'sep'">
              <tr class="month-sep">
                <td colspan="12">
                  <span class="month-sep-name" x-text="r.label"></span>
                  <span class="month-sep-sum metric">
                    <span x-text="r.count + (r.count === 1 ? ' day' : ' days')"></span> ·
                    <b x-text="r.net + 'h'"></b> / <span x-text="r.target + 'h'"></span> ·
                    <b :class="surplusClass(r.surplus)" x-text="formatSurplus(r.surplus)"></b>
                  </span>
                </td>
              </tr>
            </template>
            <template x-if="r.kind === 'entry'">
              <tr class="day-row" :class="[r.e.day_type !== 'work' ? 'non-work' : '', r.e._saving ? 'row-saving' : '']"
                  @click="editEntry(r.e)" :title="'Edit ' + r.e.date">
                <td class="metric" x-text="r.e.date"></td>
                <td class="dow" x-text="r.e._dow"></td>
                <td><span class="day-pill" :class="r.e.day_type" x-text="pillLabel(r.e)"></span><template x-if="hasBlocks(r.e.date)"><span class="days-fl metric" :title="flTotalLabel({ hours: blockHours(blocksOn(r.e.date)), eur: blockEur(blocksOn(r.e.date)), missing: 0 }) + ' freelance'" x-text="'⚡' + fmtHours(blockHours(blocksOn(r.e.date)))"></span></template></td>
                <td class="num metric" x-text="r.e.start_time || '—'"></td>
                <td class="num metric" x-text="r.e.end_time || '—'"></td>
                <td class="num metric" x-text="r.e.total_break_minutes ? r.e.total_break_minutes + 'm' : '—'"></td>
                <td class="num metric" x-text="r.e.net_hours + 'h'"></td>
                <td class="num metric" x-text="r.e.target_hours + 'h'"></td>
                <td class="num metric" :class="surplusClass(r.e.surplus_hours)" x-text="formatSurplus(r.e.surplus_hours)"></td>
                <td class="num metric" :class="surplusClass(r.e._cumulative)" x-text="formatSurplus(r.e._cumulative)"></td>
                <td class="notes-col" x-html="r.e.notes ? highlightNotes(r.e.notes, notesQuery) : ''"></td>
                <td class="act-col" @click.stop>
                  <template x-if="!r.e._saving">
                    <button type="button" class="row-edit" @click="editEntry(r.e)" aria-label="Edit" :title="'Edit ' + r.e.date">✎</button>
                  </template>
                  <template x-if="r.e._saving">
                    <span class="saving-indicator" aria-label="Saving…">⏳</span>
                  </template>
                </td>
              </tr>
            </template>
          </tbody>
        </template>

  </div>
  </template>
</section>
